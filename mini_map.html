<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Kairos – Mini Map</title>
<!-- Minimapa v panelu Info prohlížeče: stejný přibalený MapLibre GL JS 5 jako map_vault.html.
     Founder audit 2026-11-03: dřív styl OpenFreeMap „dark“ – na úrovni ulic téměř černá plocha,
     která s hlavní mapou neměla nic společného. Teď STEJNÝ podklad Základní jako hlavní mapa
     (liberty přes map_style.js: popisky v jazyce aplikace, pastelové plochy) a stejné úložiště
     dlaždic (tile_store.py) – co už hlavní mapa stáhla, je tu hned. Místo červené kapky
     pulzující bod polohy. Stránka se načte jednou, další fotky jen posunou bod (window.showPlace).
     Vše ostatní blokuje WebUrlInterceptor v main.py (ALLOWED_WEB_HOSTS). -->
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="map_style.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #E4E8EC;
               font-family: 'Segoe UI Variable Text', 'Segoe UI', -apple-system, sans-serif; }
  #map { position: absolute; inset: 0; background: #E4E8EC; }
  #nogl { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
          color: #8E8E93; font-size: 12px; background: #1C1C1E; }
  /* Pulzující bod polohy (jako „tady“ v Mapách): bílý lem, barva zvýraznění, měkké vlny */
  .here { position: relative; width: 18px; height: 18px; --accent: #5E64E8; }
  .here .core { position: absolute; inset: 0; border-radius: 50%; background: var(--accent);
                border: 3px solid #FFFFFF; box-sizing: border-box;
                box-shadow: 0 1px 4px rgba(0,0,0,0.35), 0 0 0 0.5px rgba(0,0,0,0.12); }
  .here .pulse { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px;
                 border-radius: 50%; background: var(--accent); opacity: 0;
                 animation: here-pulse 2.4s cubic-bezier(0.2, 0.6, 0.35, 1) infinite; }
  .here .pulse.late { animation-delay: 1.2s; }
  @keyframes here-pulse { 0% { transform: scale(1); opacity: 0.42; } 100% { transform: scale(3.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .here .pulse { animation: none; } }
  body.still .here .pulse { animation: none; }
  .maplibregl-ctrl-attrib { background: rgba(255,255,255,0.7) !important; color: #6E6E73 !important; font-size: 9px; }
  .maplibregl-ctrl-attrib a { color: #48484A !important; }
  .maplibregl-ctrl-attrib.maplibregl-compact:not(.maplibregl-compact-show) { background: rgba(255,255,255,0.55) !important; }
  .maplibregl-ctrl-attrib-button { opacity: 0.55; transform: scale(0.8); }
</style>
</head>
<body>
<div id="map"></div>
<div id="nogl">Map unavailable</div>
<script>
  window.setStrings = function (dict, lang) {      // Gate 1: texty z katalogu aplikace
    document.documentElement.lang = lang || 'en';
    if (dict && dict.unavailable) document.getElementById('nogl').textContent = dict.unavailable;
    window.setMiniLanguage && window.setMiniLanguage(lang || 'en');
    return true;
  };
(function () {
  'use strict';
  var MS = window.KairosMapStyle;
  var ESRI_STREET = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}';
  var ZOOM = 14.5;
  var NEAR_DEG = 0.5;                  // sousední fotka blízko = krátký posun místo skoku
  var BG = '#E4E8EC';                  // pozadí Základní (addBaseBackground v map_vault.html)

  var mapEl = document.getElementById('map');
  var map = null, marker = null, place = null, engine = 'none', errors = [], lang = 'en';
  var store = MS.makeStore(window.TILE_STORE_CONFIG);   // vloženo aplikací (viewer.py) před skripty

  // Raster bez stylu (offline / styl se ještě nestáhl): světlá Esri – navazuje na Základní
  var RASTER_STYLE = {
    version: 8,
    sources: { esri: { type: 'raster', tileSize: 256, maxzoom: 19, tiles: [ESRI_STREET],
                       attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap' } },
    layers: [{ id: 'bg', type: 'background', paint: { 'background-color': BG } },
             { id: 'esri', type: 'raster', source: 'esri' }]
  };

  function build(style) {
    var s = MS.standard(style, MS.nameField(lang));
    if (!(s.layers.length && s.layers[0].type === 'background')) {
      s.layers.unshift({ id: 'base-bg', type: 'background', paint: { 'background-color': BG } });
    }
    return s;
  }

  function cachedStyle() {
    try {
      var s = JSON.parse(localStorage.getItem(MS.STYLE_CACHE_KEY) || 'null');
      return MS.validStyle(s) ? s : null;
    } catch (e) { return null; }
  }
  var vectorStyle = cachedStyle();

  function useVector(style) {
    if (!MS.validStyle(style)) return false;
    vectorStyle = style;
    if (map) { map.setStyle(build(style), { diff: false }); engine = 'vector'; }
    return true;
  }
  window.setMiniStyle = useVector;     // testy bez sítě
  window.setMiniLanguage = function (code) {
    lang = code || 'en';
    if (map && engine === 'vector' && vectorStyle) map.setStyle(build(vectorStyle), { diff: false });
  };
  window.setAccent = function (hex) {  // bod polohy v barvě zvýraznění aplikace
    if (typeof hex !== 'string' || !/^#[0-9a-fA-F]{6}$/.test(hex)) return false;
    var el = marker && marker.getElement();
    if (el) el.style.setProperty('--accent', hex);
    pendingAccent = hex;
    return true;
  };
  var pendingAccent = null;
  window.setStill = function (still) { document.body.classList.toggle('still', !!still); };   // omezený pohyb

  function fetchStyle() {               // čerstvý styl na pozadí; přestavět jen při změně
    fetch(MS.STYLE_URL).then(function (r) { return r.ok ? r.json() : null; }).then(function (s) {
      if (!MS.validStyle(s)) return;
      var changed = JSON.stringify(s) !== JSON.stringify(vectorStyle);
      try { localStorage.setItem(MS.STYLE_CACHE_KEY, JSON.stringify(s)); } catch (e) { /* plná */ }
      if (changed || engine !== 'vector') useVector(s);
    }).catch(function () { /* offline: zůstává uložený styl nebo rastr */ });
  }

  function glSupported() {
    try { return !!(window.maplibregl && document.createElement('canvas').getContext('webgl2')); }
    catch (e) { return false; }
  }

  function hereElement() {
    var el = document.createElement('div');
    el.className = 'here';
    el.innerHTML = '<div class="pulse"></div><div class="pulse late"></div><div class="core"></div>';
    if (pendingAccent) el.style.setProperty('--accent', pendingAccent);
    return el;
  }

  function transformRequest(url, type) {
    if (type !== 'Tile' || !store) return undefined;
    var s = MS.storeUrl(store, url);
    return s === url ? undefined : { url: s };
  }

  function createMap() {
    if (map || !place || mapEl.clientWidth === 0 || mapEl.clientHeight === 0) return;
    if (!glSupported()) { document.getElementById('nogl').style.display = 'flex'; return; }
    try {
      map = new maplibregl.Map({
        container: mapEl, center: place, zoom: ZOOM, maxZoom: 19,
        style: vectorStyle ? build(vectorStyle) : RASTER_STYLE,
        attributionControl: { compact: true }, dragRotate: false, pitchWithRotate: false,
        fadeDuration: 150, transformRequest: transformRequest
      });
    } catch (e) {
      map = null;
      document.getElementById('nogl').style.display = 'flex';
      return;
    }
    engine = vectorStyle ? 'vector' : 'raster';
    map.touchZoomRotate.disableRotation();
    map.once('load', function () {       // atribuce sbalená do (i) – v 180px panelu nesmí zakrýt mapu
      var a = document.querySelector('.maplibregl-ctrl-attrib');
      if (a) a.classList.remove('maplibregl-compact-show');
    });
    map.on('error', function (e) { errors.push(String((e && e.error && e.error.message) || e)); });
    map.on('styleimagemissing', function (e) {      // ikona, kterou sprite nemá: průhledný 1×1 px
      if (!map.hasImage(e.id)) map.addImage(e.id, { width: 1, height: 1, data: new Uint8Array(4) });
    });
    marker = new maplibregl.Marker({ element: hereElement(), anchor: 'center' })
      .setLngLat(place).addTo(map);
    window.map = map;
    setTimeout(fetchStyle, vectorStyle ? 3000 : 0);  // s uloženým stylem až po prvním vykreslení
  }

  // Volá viewer.py při každé fotce s polohou
  window.showPlace = function (lat, lon) {
    lat = Number(lat); lon = Number(lon);
    if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return false;
    var prev = place;
    place = [lon, lat];
    if (!map) { createMap(); return true; }
    marker.setLngLat(place);
    var near = prev && Math.abs(prev[0] - lon) < NEAR_DEG && Math.abs(prev[1] - lat) < NEAR_DEG;
    if (near && document.visibilityState === 'visible') map.easeTo({ center: place, zoom: ZOOM, duration: 350 });
    else map.jumpTo({ center: place, zoom: ZOOM });
    return true;
  };

  window.miniState = function () {
    var c = map ? map.getCenter() : null, m = marker ? marker.getLngLat() : null;
    var bg = null;
    try { bg = map && map.getStyle().layers[0].paint['background-color']; } catch (e) { /* styl se mění */ }
    return { ready: !!map, engine: engine, center: c ? [c.lng, c.lat] : null,
             pin: m ? [m.lng, m.lat] : null, marker: marker ? marker.getElement().className : null,
             store: !!store, background: bg, errors: errors.slice(-5) };
  };

  function onResize() { if (!map) createMap(); else map.resize(); }
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(mapEl);
  window.addEventListener('resize', onResize);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
