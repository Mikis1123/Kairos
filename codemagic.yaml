# Kairos for iPhone on Codemagic: contract tests + unsigned .ipa for Sideloadly (no Mac needed).
# Mirrors .github/workflows/ios.yml. Connect the repo in Codemagic and start "ios-build".
workflows:
  ios-build:
    name: iOS build (unsigned .ipa)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events: [push, pull_request]
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    when:
      changeset:
        includes: ["ios/", "codemagic.yaml"]
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      # Before xcodegen on purpose: with Kairos.xcodeproj present, xcodebuild in ios/ picks the
      # app project instead of Package.swift, whose auto-generated "Kairos-Package" scheme holds
      # KairosCoreTests. The simulator is picked from what this Xcode ships (names change per release).
      - name: KairosCore contract tests
        script: |
          set -euo pipefail
          cd ios
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devs if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[-1].split("-")])
          for runtime in reversed(ios):
              for d in devs[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("no iPhone simulator")')
          mkdir -p ../build
          xcodebuild test \
            -scheme Kairos-Package \
            -destination "id=$UDID" \
            -only-testing:KairosCoreTests \
            -derivedDataPath ../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee ../build/test.log | grep -E "Test Suite|Test Case.*(passed|failed)|error:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" ../build/test.log

      - name: Generate Xcode project
        script: cd ios && xcodegen generate

      - name: Archive unsigned app
        script: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/Kairos.xcodeproj \
            -scheme Kairos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Kairos.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" build/archive.log

      - name: Package .ipa
        script: |
          set -euo pipefail
          APP=build/Kairos.xcarchive/Products/Applications/Kairos.app
          test -d "$APP"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Kairos-unsigned.ipa Payload)
          ls -lh build/Kairos-unsigned.ipa

    artifacts:
      - build/*.ipa
      - build/*.log
