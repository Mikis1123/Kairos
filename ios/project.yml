# XcodeGen spec:  brew install xcodegen && cd ios && xcodegen  ->  Kairos.xcodeproj
name: Kairos
options:
  bundleIdPrefix: app.kairos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Kairos:
    path: .
targets:
  KairosApp:
    type: application
    platform: iOS
    sources:
      - path: KairosApp
    dependencies:
      - package: Kairos
        product: KairosCore
      - package: Kairos
        product: KairosUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kairos.ios
        PRODUCT_NAME: Kairos
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Kairos connects to your Kairos desktop on this network to sync your library."
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan the pairing code shown by Kairos on your computer."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock your Hidden folder."
    info:
      path: KairosApp/Info.plist
      properties:
        # The desktop bridge uses a self-signed certificate pinned by SHA-256 (PinnedTrust.swift).
        # ATS still applies to every other host.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  Kairos:
    build:
      targets:
        KairosApp: all
# Core tests: `swift test` in ios/ (or open Package.swift in Xcode) - they need no simulator.
