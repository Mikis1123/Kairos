# XcodeGen spec:  brew install xcodegen && cd ios && xcodegen  ->  Kairos.xcodeproj
name: Kairos
options:
  bundleIdPrefix: app.kairos
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  Kairos:
    path: .
targets:
  KairosApp:
    type: application
    platform: iOS
    sources:
      - path: KairosApp
        excludes: ["Resources/**"]
      # bundled offline world base map (ios/tools/build_world_lite.py)
      - path: KairosApp/Resources
        buildPhase: resources
    dependencies:
      - package: Kairos
        product: KairosCore
      - package: Kairos
        product: KairosUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kairos.ios
        PRODUCT_NAME: Kairos
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Kairos connects to your Kairos desktop on this network to sync your library."
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan the pairing code shown by Kairos on your computer."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock your Hidden folder."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Kairos shows your camera roll next to your computer's library, without copying it, and backs up the photos that are only on this iPhone."
    info:
      path: KairosApp/Info.plist
      properties:
        # The desktop bridge uses a self-signed certificate pinned by SHA-256 (PinnedTrust.swift).
        # ATS still applies to every other host.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Phase 2: offline maps. Documents (with Documents/Maps for desktop downloads) is visible
        # in the Files app and in Finder over USB, so users can drop their own .mbtiles packs in.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Parity sprint: background sync (BackgroundSync.swift). "fetch" = BGAppRefreshTask,
        # "processing" = BGProcessingTask (backup while charging).
        UIBackgroundModes: [fetch, processing]
        # Bonjour re-discovery of the desktop after its address changed (DesktopDiscovery.swift).
        # iOS only lets an app browse the service types it declares here.
        NSBonjourServices:
          - _kairos._tcp
        BGTaskSchedulerPermittedIdentifiers:
          - app.kairos.ios.refresh
          - app.kairos.ios.backup
schemes:
  Kairos:
    build:
      targets:
        KairosApp: all
# Core tests: `swift test` in ios/ (or open Package.swift in Xcode) - they need no simulator.
