<title>Kairos – Places</title>
<!-- Batch 6: čistý MapLibre GL JS 5.24.0 (přibalený lokálně v vendor/, ověřené SHA-512 z npm) –
     skutečná 3D zeměkoule (projekce globe), atmosféra, 3D terén z AWS Terrain Tiles,
     piny fotek jako HTML značky, klidové otáčení, přelety a přehrávání Cesty.
     Podklady: Základní a Satelitní vektorově (OpenFreeMap, bez API klíče), bez stylu rastrová
     záloha (Esri); Turistická rastrově (OpenTopoMap + Waymarked Trails).
     Vše ostatní blokuje CSP níže (hostitel WebView2, map_host.py) a v QtWebEngine navíc
     WebUrlInterceptor v main.py (ALLOWED_WEB_HOSTS). -->
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="map_style.js"></script>
<script src="director.js"></script>

<style>
  body.drop-target::after { content: ''; position: fixed; inset: 6px; border-radius: 14px; pointer-events: none;
    box-shadow: inset 0 0 0 2px var(--accent), inset 0 0 40px var(--accent-soft); z-index: 9999; }
  :root { --accent: #8B7CF6; --accent-soft: rgba(139,124,246,0.28);
          --glass: rgba(30,30,34,0.62); --glass-strong: rgba(30,30,34,0.86);
          --hair: rgba(255,255,255,0.12); --text: #F5F5F7; --text-2: #A1A1AA; --ease: cubic-bezier(.2,.8,.2,1); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06070C;
               font-family: 'Segoe UI Variable Text', 'Segoe UI', -apple-system, sans-serif; color: var(--text); }
  /* Vesmír za zeměkoulí: plátno MapLibre je mimo glóbus průhledné */
  #map { position: absolute; inset: 0;
         background: radial-gradient(ellipse 70% 60% at 50% 46%, #141B33 0%, #0A0D18 55%, #05060B 100%); }
  /* Seamless hand-off (map_host.py): last frame above the canvas, under every control */
  #handoff-veil { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* Cold load: the same thin arc the host paints before the page exists (map_host.paint_placeholder) */
  #maploading { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px;
                pointer-events: none; opacity: 0; transition: opacity .2s var(--ease); }
  #maploading.on { opacity: 1; }
  #maploading::before, #maploading::after { content: ''; position: absolute; inset: 0; border-radius: 50%;
                box-sizing: border-box; border: 2px solid rgba(255,255,255,0.12); }
  #maploading::after { border-color: transparent; border-top-color: rgba(255,255,255,0.59);
                       animation: maploading-spin .9s linear infinite; }
  @keyframes maploading-spin { to { transform: rotate(360deg); } }
  .glass { background: var(--glass); border: 1px solid var(--hair); box-shadow: 0 8px 28px rgba(0,0,0,0.45);
           backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); }
  button { font: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Den a noc Cesty: tónování mezi mapou a piny (vkládá se do kontejneru plátna) */
  #tint { position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: multiply;
          transition: opacity 1.6s ease, background-color 1.6s ease; }

  .maplibregl-ctrl-attrib { background: rgba(28,28,30,0.72) !important; color: #8E8E93 !important; font-size: 10px; }
  .maplibregl-ctrl-attrib a { color: #AEAEB2 !important; }
  .maplibregl-ctrl-attrib-button { filter: contrast(0) brightness(2); }   /* bílá ikona (ne invert – žádné filtry přes dlaždice) */
  .maplibregl-ctrl-group { background: var(--glass) !important; border: 1px solid var(--hair);
                           box-shadow: 0 6px 22px rgba(0,0,0,0.45) !important; border-radius: 12px !important;
                           backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); overflow: hidden; }
  .maplibregl-ctrl-group button + button { border-top: 1px solid var(--hair) !important; }
  .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: contrast(0) brightness(2); }
  .maplibregl-ctrl-group button:hover { background: rgba(255,255,255,0.08) !important; }
  .maplibregl-ctrl-group button.tilt-btn { color: #F2F2F7; font: 700 11px/29px -apple-system, "Segoe UI", sans-serif;
                                           letter-spacing: .04em; }
  .maplibregl-ctrl-group button.tilt-btn[aria-pressed="true"] { color: var(--accent, #8B7CF6); }

  /* Plovoucí přepínač podkladů – skleněná kapsle vpravo nahoře (segmentový ovladač) */
  #layers { position: absolute; top: 16px; right: 16px; z-index: 10; display: flex; gap: 2px; padding: 3px;
            border-radius: 12px; }
  #layers button, .seg { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 9px; color: #EBEBF0;
                   font-size: 12px; font-weight: 600; transition: background 0.15s ease, color 0.15s ease; }
  #layers button:hover, .seg:hover { background: rgba(255,255,255,0.10); }
  #layers button:focus-visible, .seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #layers button[aria-pressed="true"] { background: rgba(255,255,255,0.92); color: #1C1C1E; }

  #hud { position: absolute; top: 16px; left: 16px; z-index: 10; display: flex; align-items: center; gap: 2px;
         padding: 3px 3px 3px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  #hud .count { padding-right: 8px; color: var(--text); }
  .seg { display: inline-flex; align-items: center; gap: 6px; }
  .seg svg { width: 14px; height: 14px; }


  /* Výběr Cesty */
  #jlist { position: absolute; top: 60px; left: 16px; z-index: 11; width: 300px; max-height: calc(100% - 180px);
           overflow-y: auto; border-radius: 14px; padding: 6px; display: none; }
  #jlist.open { display: block; animation: sheet-in .22s var(--ease); }
  #jlist .head { padding: 8px 10px 6px; color: var(--text-2); font-size: 11px; font-weight: 600;
                 letter-spacing: .06em; text-transform: uppercase; }
  #jlist button { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer;
                  padding: 9px 10px; border-radius: 10px; }
  #jlist button:hover, #jlist button:focus-visible { background: rgba(255,255,255,0.08); }
  #jlist .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #jlist .s { font-size: 11px; color: var(--text-2); margin-top: 2px; }
  @keyframes sheet-in { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

  /* Piny fotek kreslí WebGL (vrstva „pins“, obrázky z plátna) – drží přesně na souřadnicích
     i během posunu a přiblížení; HTML značky se k plátnu dorovnávaly se zpožděním („plavaly“) */

  /* Spring split / merge: moving pins as composited sprites over the canvas (runSpring) */
  #pinSprites { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; contain: strict; }
  .pin-sprite { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; will-change: transform, opacity; }

  /* Náhledová karta při najetí na pin */
  #card { position: absolute; z-index: 12; pointer-events: none; width: 216px; padding: 8px; border-radius: 12px;
          background: rgba(36,36,38,0.92); opacity: 0; transform: translate(-50%, calc(-100% + 6px));
          transition: opacity .14s ease, transform .14s ease; }
  #card.show { opacity: 1; transform: translate(-50%, -100%); }
  .card-thumbs { display: grid; gap: 3px; border-radius: 8px; overflow: hidden; margin-bottom: 7px; }
  .card-thumbs.n1 { grid-template-columns: 1fr; height: 132px; }
  .card-thumbs.n2 { grid-template-columns: 1fr 1fr; height: 104px; }
  .card-thumbs.n3 { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; height: 116px; }
  .card-thumbs.n3 .t:first-child { grid-row: span 2; }
  .card-thumbs.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; height: 132px; }
  .card-thumbs .t { background: #3A3A3C center/cover no-repeat; }
  .card-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-sub { color: #8E8E93; font-size: 11px; margin-top: 2px; }

  .notice { position: absolute; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center;
            text-align: center; color: #8E8E93; pointer-events: none; }
  .notice div { background: rgba(28,28,30,0.9); border-radius: 14px; padding: 22px 28px; max-width: 360px; }
  .notice b { display: block; color: #F5F5F7; font-size: 16px; margin-bottom: 6px; }

  /* ── Cesta 2.0: film ───────────────────────────────────────────────────────
     Dva sloupce: vlevo příběh (titulek, okamžik zastávky), vpravo mapa – ohnisko kamery je
     odsazené (padding), takže zastávka leží uprostřed volné části. Nic přes pohybující se
     plátno neruší rozostřením (backdrop-filter nad WebGL = rozmazání celé plochy za snímek);
     plné tmavé plochy a jedna statická vinětace. */
  #jx { position: absolute; inset: 0; z-index: 20; pointer-events: none; display: none;
        --mw: min(400px, 30vw, calc((100vh - 230px) * 0.74)); --ml: clamp(24px, 3.4vw, 56px); }
  body.journey #jx { display: block; }
  body.journey #layers, body.journey #hud, body.journey .maplibregl-ctrl-bottom-right { opacity: 0; pointer-events: none; }
  #layers, #hud, .maplibregl-ctrl-bottom-right { transition: opacity .4s ease; }
  #jvignette { position: absolute; inset: 0;
               background: linear-gradient(90deg, rgba(5,7,12,0.62) 0%, rgba(5,7,12,0.34) 30%, rgba(5,7,12,0) 48%),
                           radial-gradient(ellipse 80% 72% at 64% 46%, rgba(5,7,12,0) 58%, rgba(5,7,12,0.42) 100%),
                           linear-gradient(0deg, rgba(5,7,12,0.55) 0%, rgba(5,7,12,0) 22%); }
  .solid { background: rgba(18,19,24,0.88); border: 1px solid rgba(255,255,255,0.09);
           box-shadow: 0 18px 50px rgba(0,0,0,0.5); }
  /* Titulek a konec: stejný sloupec jako okamžiky zastávek */
  #jcap { position: absolute; left: var(--ml); top: 46%; width: var(--mw); box-sizing: border-box; padding: 28px 28px 26px;
          border-radius: 22px; pointer-events: auto; opacity: 0; visibility: hidden; transform: translateY(-46%);
          transition: opacity .8s var(--ease), transform 1s var(--ease), visibility 0s .8s; }
  #jcap.show { opacity: 1; visibility: visible; transform: translateY(-50%); transition-delay: 0s; }
  #jcap .eyebrow, .moment .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
                                     color: var(--accent); }
  #jcap .ago { margin-top: 6px; font-size: 13px; color: var(--text-2); }
  #jcap h1 { margin: 10px 0 8px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif;
             font-size: 30px; font-weight: 650; letter-spacing: -.015em; line-height: 1.12; }
  #jcap .meta { font-size: 13px; color: var(--text-2); line-height: 1.5; }
  #jcap .highlights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 18px; }
  #jcap .highlights:empty { display: none; }
  #jcap .highlights div { aspect-ratio: 1; border-radius: 10px; background: #2C2C2E center/cover no-repeat; }
  #jcap .actions { display: none; gap: 8px; margin-top: 20px; }
  #jcap.end .actions { display: flex; }
  #jcap.end .highlights { display: none; }
  .pill { all: unset; cursor: pointer; padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
          background: rgba(255,255,255,0.10); color: var(--text); }
  .pill:hover { background: rgba(255,255,255,0.16); }
  .pill.primary { background: var(--accent); color: #FFFFFF; }
  .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Okamžik zastávky: velká fotka s pomalým Ken Burnsem, místo a čas pod ní */
  #jmoment { position: absolute; left: var(--ml); top: 46%; width: var(--mw); transform: translateY(-50%); }
  .moment { position: absolute; left: 0; top: 0; width: 100%; transform: translateY(-50%) translateY(16px) scale(.985);
            opacity: 0; transition: opacity .7s var(--ease), transform 1s var(--ease); pointer-events: none; }
  .moment.show { opacity: 1; transform: translateY(-50%); pointer-events: auto; }
  .moment .shot { position: relative; width: 100%; aspect-ratio: 4 / 5; border-radius: 18px; overflow: hidden;
                  background: #15161A; cursor: pointer;
                  box-shadow: 0 26px 64px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08); }
  .moment .ph { position: absolute; inset: -1px; background: #2C2C2E center/cover no-repeat; opacity: 0;
                transition: opacity 1.2s ease; transform-origin: var(--kox, 50%) var(--koy, 45%); }
  .moment .ph.on { opacity: 1; }
  .moment .ph.noimg { background: linear-gradient(135deg, #3A3A3C, #232326); }
  .moment.show .ph.on { animation: kenburns var(--kb, 6s) cubic-bezier(.33,0,.4,1) both; }
  /* C5: přítah ke tvářím (transform-origin = střed obličejů z face_instances), jinak jemný přítah */
  @keyframes kenburns { from { transform: scale(1.0); } to { transform: scale(var(--kbs, 1.085)); } }
  body.paused .moment .ph { animation-play-state: paused; }
  /* Cesta 3.0: Live Photo / 3s video bez zvuku přes nejlepší snímek – stejný Ken Burns jako fotka,
     po doběhnutí prolnutí zpět na fotku (card_media.py vyrábí WebM VP9) */
  .moment video.clip { position: absolute; inset: -1px; width: calc(100% + 2px); height: calc(100% + 2px);
                       object-fit: cover; opacity: 0; transition: opacity .6s ease; pointer-events: none;
                       transform-origin: var(--kox, 50%) var(--koy, 45%); }
  .moment video.clip.on { opacity: 1; }
  .moment.show video.clip { animation: kenburns var(--kb, 6s) cubic-bezier(.33,0,.4,1) both; }
  body.paused .moment video.clip { animation-play-state: paused; }
  .moment .meta { margin-top: 16px; padding: 0 2px; text-shadow: 0 1px 14px rgba(0,0,0,0.65); }
  /* C5: typografie nastupuje postupně (štítek, místo, čas) až po fotce */
  .moment .meta > * { opacity: 0; transform: translateY(8px);
                      transition: opacity .55s var(--ease), transform .7s var(--ease); }
  .moment.show .meta > * { opacity: 1; transform: none; }
  .moment.show .meta > :nth-child(1) { transition-delay: .28s; }
  .moment.show .meta > :nth-child(2) { transition-delay: .40s; }
  .moment.show .meta > :nth-child(3) { transition-delay: .52s; }
  /* C4: hlava trasy – kometa */
  .comet { width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity .5s ease; }
  .comet.on { opacity: 1; }
  .comet .core { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%;
                 background: #FFFFFF; box-shadow: 0 0 0 3px var(--accent, #8B7CF6), 0 0 18px 6px var(--accent, #8B7CF6); }
  .comet .halo { position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; border-radius: 50%;
                 background: radial-gradient(circle, var(--accent, #8B7CF6) 0%, transparent 70%); opacity: .0;
                 transition: opacity .6s ease, transform .6s var(--ease); transform: scale(.6); }
  .comet.moving .halo { opacity: .55; transform: scale(1); }
  .moment .place { margin-top: 4px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px;
                   font-weight: 650; letter-spacing: -.012em; line-height: 1.15; overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; }
  .moment .when { margin-top: 5px; font-size: 13px; color: #C7C7CC; }
  .moment .phase { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px;
                   vertical-align: 1px; box-shadow: 0 0 8px currentColor; }
  /* Popisek přesunu nahoře: kam se jede (během okamžiku skrytý – místo nese karta) */
  #jcaption { position: absolute; top: 20px; left: calc(var(--ml) + var(--mw) + (100% - var(--ml) - var(--mw)) / 2);
              transform: translateX(-50%) translateY(-6px); padding: 8px 16px; border-radius: 14px; text-align: center;
              white-space: nowrap; opacity: 0; transition: opacity .5s ease, transform .6s var(--ease); }
  #jcaption.show { opacity: 1; transform: translateX(-50%); }
  #jcaption .place { font-size: 14px; font-weight: 650; }
  #jcaption .when { font-size: 12px; color: var(--text-2); margin-top: 1px; }
  #jcaption .phase { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px;
                     vertical-align: 1px; background: #FFD27A; box-shadow: 0 0 8px currentColor; }
  /* Kapitoly: náhled každé zastávky, průběh filmu pod nimi */
  #jdock { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(980px, calc(100% - 32px));
           display: flex; align-items: center; gap: 10px; pointer-events: auto; }
  #jctl { display: flex; gap: 2px; padding: 3px; border-radius: 12px; flex: 0 0 auto; }
  #jctl button { all: unset; cursor: pointer; width: 34px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
  #jctl button:hover { background: rgba(255,255,255,0.10); }
  #jctl button:focus-visible { outline: 2px solid var(--accent); }
  #jctl svg { width: 16px; height: 16px; fill: #F5F5F7; }
  /* C6: hudba je volitelná – vypnutá ikona je ztlumená, zapnutá v barvě zvýraznění */
  #jmusic svg { opacity: .55; }
  #jmusic[aria-pressed="true"] svg { opacity: 1; fill: var(--accent); }
  #jmusic[hidden] { display: none; }
  #jstripwrap { position: relative; flex: 1 1 auto; min-width: 0; border-radius: 14px; padding: 8px 10px 10px; box-sizing: border-box; }
  #jstrip { display: flex; gap: 6px; overflow-x: auto; height: 50px; align-items: center; scrollbar-width: none; }
  #jstrip::-webkit-scrollbar { display: none; }
  .chap { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 9px; background: #2C2C2E center/cover no-repeat;
          cursor: pointer; opacity: .42; transform: scale(.9);
          transition: opacity .5s ease, transform .5s var(--ease), box-shadow .5s ease; }
  .chap.noimg { background: linear-gradient(135deg, #3A3A3C, #232326); }
  .chap.seen { opacity: .85; transform: none; }
  .chap.now { opacity: 1; transform: translateY(-2px) scale(1.06);
              box-shadow: 0 0 0 2px var(--accent), 0 8px 18px rgba(0,0,0,0.5); }
  .chap:hover { opacity: 1; }
  /* Seekable timeline: a 2 px line in a 14 px hit area along the bottom of the strip; it grows
     on hover, a click or drag scrubs the film (director time), day boundaries are ticks */
  #jprogress { position: absolute; left: 10px; right: 10px; bottom: -2px; height: 14px; cursor: pointer;
               touch-action: none; outline: none; }
  #jprogress::before { content: ''; position: absolute; left: 0; right: 0; top: 6px; height: 2px; border-radius: 2px;
                       background: rgba(255,255,255,0.12); transition: height .15s ease, top .15s ease; }
  #jprogress i { position: absolute; left: 0; right: 0; top: 6px; display: block; height: 2px; border-radius: 2px;
                 background: var(--accent); transform-origin: 0 50%; transform: scaleX(0);
                 transition: height .15s ease, top .15s ease; }
  #jprogress:hover::before, #jprogress:hover i, #jprogress.drag::before, #jprogress.drag i,
  #jprogress:focus-visible::before, #jprogress:focus-visible i { top: 5px; height: 4px; }
  #jprogress b { position: absolute; inset: 0; pointer-events: none; }
  #jprogress b span { position: absolute; top: 3px; width: 2px; height: 8px; margin-left: -1px; border-radius: 1px;
                      background: rgba(255,255,255,0.45); }
  /* Day chapters of a multi-day Journey: "Whole trip" + one pill per day above the dock */
  #jdays { position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); max-width: min(980px, calc(100% - 32px));
           display: flex; gap: 4px; padding: 4px; border-radius: 14px; overflow-x: auto; scrollbar-width: none;
           pointer-events: auto; box-sizing: border-box; }
  #jdays[hidden] { display: none; }
  #jdays::-webkit-scrollbar { display: none; }
  #jdays button { all: unset; flex: 0 0 auto; cursor: pointer; display: flex; align-items: center; gap: 7px;
                  padding: 4px 11px 4px 4px; border-radius: 10px; font-size: 12px; color: #F5F5F7; white-space: nowrap;
                  transition: background .2s ease, box-shadow .2s ease; }
  #jdays button.whole { padding-left: 11px; font-weight: 650; }
  #jdays button:hover { background: rgba(255,255,255,0.10); }
  #jdays button:focus-visible { outline: 2px solid var(--accent); }
  #jdays button[aria-selected="true"] { background: rgba(255,255,255,0.16); box-shadow: inset 0 0 0 1.5px var(--accent); }

  function onStyleLoad() {

  // Cesta 3.0 (C7): MapLibre 5 tu běžel s JEDNÍM workerem (getWorkerCount() = 1 na 16 vláknech) –
  // všechny vektorové i výškové dlaždice se dekódovaly jedna po druhé a za letu, kdy zoom

  // ── C7e: místní úložiště dlaždic (tile_store.py) ──

    var hosts = {};

    TILE_STORE = { bases: cfg.bases.slice(), hosts: hosts };
    return true;

  setTileStore(window.TILE_STORE_CONFIG);        // vloženo aplikací před skripty stránky

    var key = m[1].toLowerCase() + '/' + m[2], sum = 0;

  // Measured 2026-11-03 (bench_map_webview2, 120 Hz, film): raising it to 32 tripled dropped
  // frames (1-3 % -> 9 %, more tiles landing and uploading per frame). It stays at 16; the
  // tile store's warm-up queues do the parallel fetching instead, off the page's frame budget.

  // ── Founder audit: 3D kroužení kamerou ───────────────────────────────────────

    });

      alt = null;

  // moveend synchronously every time. Measured (eval/bench_map_orbit.py): each orbit frame ran the
  // whole "camera came to rest" path. That meant re-clustering the pins plus a setData that
  // re-tiled them in the worker, terrain sync, full-resolution restore, and detail level 0
  // (mesh 128) only to drop back to the motion level on the next frame (mesh cache rebuilt

  // ORBIT_SETTLE_MS after the last orbit step. The adaptive detail sees it as moving.
  var ORBIT_SETTLE_MS = 160;

  function orbitActive() { return orbitSession.on && !window.ORBIT_TUNING_OFF; }

    clearTimeout(orbitSession.timer);
    orbitSession.timer = setTimeout(endOrbitSession, ORBIT_SETTLE_MS);

  // ── Predictive orbit ring ──
  // An orbit only swings the bearing (and the tilt a little), so the tiles it will need are known
  // when it starts. Warm the frustum at 8 bearings around the current one, at the current tilt
  // and at the steepest tilt, through the tile store/HTTP cache (prefetchPoints). That way the
  // horizon tiles are local before the camera turns toward them. This runs once per orbit
  // session, or again after the camera moves more than half a screen.
  var ORBIT_RING_STEPS = 8;
  var orbitRing = { key: '', last: 0 };
  function warmOrbitRing() {
    if (!map || window.ORBIT_TUNING_OFF || map.getZoom() < TERRAIN_MIN_ZOOM - 1) return 0;
    var c = map.getCenter(), z = map.getZoom();
    var key = Math.round(z * 2) + ':' + (c.lng * Math.pow(2, z) / 360 * 2).toFixed(0) + ':' +
              (c.lat * Math.pow(2, z) / 360 * 2).toFixed(0);

    orbitRing.key = key;
    var pts = [], b0 = map.getBearing(), p0 = Math.max(map.getPitch(), 30);
    try { prefetchTr = map.transform.clone(); } catch (e) { prefetchTr = null; }
    if (!prefetchTr) return 0;
    for (var i = 0; i < ORBIT_RING_STEPS; i++) {
      var b = b0 + i * 360 / ORBIT_RING_STEPS;
      frustumTiles({ c: [c.lng, c.lat], z: z, p: p0, b: b }, null, pts, 5, 4);
      if (p0 < MAX_PITCH - 5) frustumTiles({ c: [c.lng, c.lat], z: z, p: MAX_PITCH, b: b }, null, pts, 5, 2);
    }

    orbitRing.last = prefetchPoints(pts);

  // ── Momentum: exponential coast with a continuous release ───────────────────
  // MapLibre's pan inertia (handler_inertia.ts) scales the release speed by linearity 0.3, plans
  // a linear deceleration and plays it on bezier(0, 0, .3, 1). The curve's opening slope is
  // 3.3x its average, so the map leaves the finger at ~0.5x the real release speed: a visible
  // speed drop on the release frame, then a short, abrupt coast. The replacement is a true
  // exponential decay (x(t) = A·(1 - e^(-t/τ))): its first frame moves at exactly the release
  // speed, it slows the same way at every point, and it stops when the remaining motion falls
  // below a physical sub-pixel. A release after a pause (the hand stopped, then let go) does not
  // coast, so careful positioning does not drift. Pure pans only; pinch/rotate flings keep
  // MapLibre's curve.
  var MOMENTUM_TAU_MS = 325;          // decay time constant (iOS "normal" scroll ≈ 500, "fast" ≈ 100)
  var MOMENTUM_WINDOW_MS = 100;       // release velocity: drag samples of the last 100 ms
  var MOMENTUM_PAUSE_MS = 50;         // no drag sample this long before release = no coast
  var MOMENTUM_MIN_SPEED = 60, MOMENTUM_MAX_SPEED = 4200;   // CSS px/s
  var MOMENTUM_STOP_PX = 0.35;        // remaining motion under 0.7 device px at 2x = done
  var MOMENTUM_MAX_MS = 2400;

  function momentumPlan(speed) {      // speed in CSS px/s -> {duration ms, amount px, easing}
    var tau = +window.MOMENTUM_TAU_MS_OVERRIDE || MOMENTUM_TAU_MS;
    var A = speed * tau / 1000;
    var T = Math.min(MOMENTUM_MAX_MS, tau * Math.log(Math.max(1.0001, A / MOMENTUM_STOP_PX)));
    var k = T / tau, norm = 1 - Math.exp(-k);

  }

  function releaseVelocity(buffer, now) {     // [{time, settings:{panDelta}}] -> {x, y} px/s | null
    var b = buffer.filter(function (e) { return now - e.time <= MOMENTUM_WINDOW_MS && e.settings && e.settings.panDelta; });
    if (b.length < 2 || now - b[b.length - 1].time > MOMENTUM_PAUSE_MS) return null;
    var dt = (b[b.length - 1].time - b[0].time) / 1000;
    if (dt < 0.008) return null;
    var x = 0, y = 0;
    for (var i = 1; i < b.length; i++) { x += b[i].settings.panDelta.x; y += b[i].settings.panDelta.y; }

    } else {

    }

    pose = { c: c, z: z, frac: p[0],

  function lerpLon(a, b, t) { return a + angleTo(a, b) * t; }

  }

  // ── Cesta 3.0 (C1): celý film jako jedna C2 křivka ──
  // Geometrie se navzorkuje na pravidelné mřížce (CAM_DT), každý kanál (merkátor x / y, zoom,
  // náklon, směr) se vyhladí bez fázového posunu (exponenciála tam a zpět) a čte se jako
  // uniformní kubický B-spline – spojitá poloha, rychlost i zrychlení přes všechny švy
  // (přesun → okamžik → přesun, oblouk van Wijk → klouzání). B-spline je lokální: pozdní trasa

  }

  function unwrapSample(s, p) {       // rozbalení přes antimeridián a přes 360° (navázání za změnou)
    s.x += Math.round(p.x - s.x);

  }
  // ── Sprint 1: zpomalení na hranicích úrovní dlaždic ──

  // se celé zorné pole musí znovu dekódovat ve workerech (zbylé díry Cesty 3.0). Zoom za letu
  // se proto přemapuje monotónní funkcí z - A·sin(2πz)/2π: na hranici úrovně se zoom mění
  // (1 - A)× pomaleji, mezi hranicemi o tolik rychleji – průměrná rychlost a cíle se nemění
  // (f(z) = z v celých i polovičních hodnotách). Váha podle rychlosti zoomu: v okamžiku
  // (kamera stojí) je zoom přesně podle plánu, rampa je hladká (C2 zůstane).
  // Naměřeno (bench_journey_live, výlet 21, teplá + restart): díry vektorů 2,5 % s i bez zpomalení,
  // vynechané snímky beze změny -> výchozí VYPNUTO (mění tempo kamery bez přínosu). Rastrový
  // podklad díry zakrývá sám. Hodnota 0.6 = zapnuto (pokusy, slabší stroje).
  var ZOOM_DETENT = 0, ZOOM_DETENT_ON = 0.6, ZOOM_DETENT_FULL = 0.5;   // A; rychlost zoomu pro plnou váhu

  // ── vykreslení okamžiku t: kamera, trasa, obloha, UI ──

    var r = filmPoseAt(director.t), seg = r.seg, pose = r.pose;

                   bearing: pose.b, padding: filmPadInto(seg, r.u) });

    else if (seg.kind === 'dwell' || seg.kind === 'outro') setRouteLeg(seg.i, 1);

    var p = film.pad;

  }

  }
  function filmSky(seg, u) {
    var st = journey.data.stops, a, b, k = 1;
    if (seg.kind === 'intro') { a = { el: 40, az: 210 }; b = stopSky(st[0]); k = 0; }
    else if (seg.kind === 'outro') { a = stopSky(st[st.length - 1]); b = { el: 40, az: 210 }; k = smoothstep(u); }
    else if (seg.kind === 'dwell') { a = b = stopSky(st[seg.i]); }

    s.az = az;
    applySky(s);

  }

  // ── UI filmu: stav odvozený z času (žádné časovače) ──
  function stopIndexOf(seg) { return seg.kind === 'intro' ? -1 : seg.i; }
  function cardStopAt(seg, u) {       // který okamžik je vidět (null = žádný)
    if (seg.kind === 'dwell') return seg.i;
    if ((seg.kind === 'glide' || seg.kind === 'hop') && u >= CARD_IN_U) return seg.i;
    if ((seg.kind === 'glide' || seg.kind === 'hop') && seg.i > 0 && u < CARD_OUT_U) return seg.i - 1;
    return null;
  }
  function syncFilm(seg, u) {
    var i = stopIndexOf(seg), st = journey.data.stops;
    if (i !== journey.i) {
      journey.i = i;
      if (i >= 0) captionFor(i);
      markChapters(i);
      markDays();
    }
    var travel = seg.kind === 'glide' || seg.kind === 'hop';
    showCaption(travel && u > 0.06 && u < CARD_IN_U && i >= 0);
    var card = cardStopAt(seg, u);
    if (card !== journey.card) showMoment(card);
    if (seg.kind === 'dwell' && journey.card === seg.i && u >= CLIP_AT_U && !journey.paused) playClip();
    if (seg.kind === 'dwell' && journey.card === seg.i && u >= SECOND_SHOT_U && seg.dur >= SECOND_SHOT_MIN_S) secondShot();

    if (seg.kind === 'intro') cap.classList.toggle('show', u < 0.86);
    else if (seg.kind !== 'outro' && cap.classList.contains('show') && !journey.ended) cap.classList.remove('show');
    if (seg.kind === 'outro' && !journey.ended) beginEnding();
    if (seg.kind === 'outro' && u >= 0.55 && !cap.classList.contains('show')) {
      cap.classList.add('show');

    if (bar) bar.style.transform = 'scaleX(' + (director.t / film.total).toFixed(4) + ')';
    var pct = Math.round(100 * director.t / film.total);
    if (pct !== journey.pct) { journey.pct = pct; document.getElementById('jprogress').setAttribute('aria-valuenow', pct); }
    if (seg.kind === 'dwell' && u < 0.05 && !journey.trailAsked[seg.i]) {

    }
  }
  function captionFor(i) {
    var s = journey.data.stops[i], sun = sunPosition(s.lat, s.lon, s.start), sky = sun ? skyAt(sun.el) : skyAt(40);
    document.getElementById('jplace').textContent = s.city || T('stop-n', { n: i + 1 });
    document.getElementById('jwhen').textContent = [phaseLabel(sun), fmtDate(s.start) + (fmtTime(s.start) ? ' ' + fmtTime(s.start) : '')]
      .filter(Boolean).join(' · ');

  function showCaption(on) {

  }

  // Okamžik zastávky: nejlepší snímek (journey.best_shot: oblíbená > série pHash > ostrost),
  // u delšího okamžiku prolnutí na druhý snímek. Dvě karty se prolínají (stará odchází, nová přichází).
  function stopShots(s) {

  }
  function momentHtml(s, i) {
    var sun = sunPosition(s.lat, s.lon, s.start), sky = sun ? skyAt(sun.el) : skyAt(40);
    var when = [fmtDate(s.start) + (fmtTime(s.start) ? ' · ' + fmtTime(s.start) : ''), czCount(s.count || (s.photos || []).length)]
      .filter(Boolean).join(' · ');
    return '<div class="shot"></div><div class="meta"><div class="eyebrow">' + esc((i + 1) + ' / ' + journey.data.stops.length)
         + (phaseLabel(sun) ? ' · ' + esc(phaseLabel(sun)) : '') + '</div><div class="place">'
         + '<span class="phase" style="background:' + sky.glow + ';color:' + sky.glow + '"></span>'

  function showMoment(i) {

    });

      var on = shot.querySelector('.ph.on');

  }
  // ── Pohyb v kartě: Live Photo / 3s video (jen vysoký profil, ne s omezenými animacemi) ──

  function buildChapters() {

      var b = s.best || (s.photos || [])[0];
      var f = document.createElement('div');
      f.className = 'chap';
      f.setAttribute('role', 'listitem');
      f.dataset.stop = i;
      f.dataset.id = b ? b.id : '';
      f.title = [s.city || T('stop-n', { n: i + 1 }), fmtDate(s.start), fmtTime(s.start)].filter(Boolean).join(' · ');
      setBg(f, b ? b.thumb : '');

  function markChapters(i) {
    var chaps = document.querySelectorAll('#jstrip .chap');
    Array.prototype.forEach.call(chaps, function (f, k) {
      f.classList.toggle('now', k === i);
      f.classList.toggle('seen', k < i);
    });
    var now = chaps[i];
    if (now) {
      var strip = document.getElementById('jstrip');
      var x = now.offsetLeft - strip.clientWidth / 2 + now.offsetWidth / 2;

    }
  }
  function highlights(data) {         // titulek: tři zastávky s nejvíc fotkami (v pořadí cesty)
    var idx = data.stops.map(function (s, i) { return i; })
      .sort(function (a, b) { return (data.stops[b].count || 0) - (data.stops[a].count || 0); }).slice(0, 3).sort();
    return idx.map(function (i) { var b = data.stops[i].best || (data.stops[i].photos || [])[0]; return b ? b.thumb : ''; })
      .filter(Boolean);
  }

  // ── Přednačtení dlaždic podle dráhy kamery ──────────────────────────────────
  // HTTP cache profilu: MapLibre je pak v daném místě načte z disku. Vzorkuje se plán filmu
  // PREFETCH_AHEAD_S dopředu v krocích PREFETCH_STEP_S – přesně ve výškách, kudy kamera poletí

  }
  // ── C6: hudební podkres (volitelný, přibalené skladby ambient_music.py) ──
  // Prolínání hlasitosti: náběh s úvodem, ztlumení při pauze, doznění v závěru a při ukončení.
  var MUSIC_VOLUME = 0.5, MUSIC_IN_MS = 2600, MUSIC_PAUSE_MS = 600, MUSIC_OUT_MS = 4200, MUSIC_STOP_MS = 1200;
  var music = { enabled: false, tracks: [], el: null, track: -1, fader: 0, target: 0 };
  function musicButton() {
    var b = document.getElementById('jmusic');
    b.hidden = !music.tracks.length;
    b.setAttribute('aria-pressed', music.enabled ? 'true' : 'false');
    b.setAttribute('aria-label', music.enabled ? T('music-off') : T('music-on'));
    b.title = b.getAttribute('aria-label');
  }
  window.setJourneyMusic = function (cfg) {      // aplikace: {enabled, tracks: [{title, url}]}
    cfg = cfg || {};
    if (Array.isArray(cfg.tracks)) music.tracks = cfg.tracks.filter(function (t) { return t && t.url; });
    if (cfg.enabled !== undefined) music.enabled = !!cfg.enabled;
    musicButton();
    syncMusic();
    return music.tracks.length;
  };
  function musicFade(target, ms, then) {
    var el = music.el;
    if (!el) return;
    clearInterval(music.fader);
    music.target = target;
    var from = el.volume, t0 = performance.now();
    if (ms <= 0) { el.volume = target; if (then) then(); return; }
    music.fader = setInterval(function () {
      var k = Math.min(1, (performance.now() - t0) / ms);
      el.volume = Math.max(0, Math.min(1, from + (target - from) * (k * k * (3 - 2 * k))));
      if (k >= 1) { clearInterval(music.fader); music.fader = 0; if (then) then(); }
    }, 40);
  }
  function musicStart() {
    if (!music.tracks.length || !journey.data) return;
    var i = musicIndexFor(journey.data);                              // stejná Cesta = stejná skladba
    if (!music.el || music.track !== i) {
      if (music.el) music.el.pause();
      music.el = new Audio(music.tracks[i].url);
      music.el.loop = true;
      music.el.volume = 0;
      music.track = i;
    }
    var p = music.el.play();
    if (p && p.catch) p.catch(function () {});
    musicFade(MUSIC_VOLUME, MUSIC_IN_MS);
  }
  function musicStop(ms, rewind) {
    if (!music.el) return;
    var el = music.el;
    musicFade(0, ms, function () { el.pause(); if (rewind) el.currentTime = 0; });
  }
  // Stav hudby odvozený ze stavu Cesty (volá se při každé změně: start, pauza, závěr, konec)
  function syncMusic() {
    var want = music.enabled && journey.active && !journey.paused && !journey.ended;
    if (want && (!music.el || music.el.paused || music.target === 0)) musicStart();
    else if (!want && music.el && !music.el.paused && music.target !== 0) {
      musicStop(!journey.active ? MUSIC_STOP_MS : journey.ended ? MUSIC_OUT_MS : MUSIC_PAUSE_MS, !journey.active || journey.ended);
    }
  }
  // ── Sprint 4: beat synchronizace (Director) ──
  // Plán filmu počítá s tím, že čas skladby = čas filmu (hudba startuje s úvodem od nuly a hraje
  // ve smyčce). Příjezdy na zastávky jsou naplánované na doby (planFilm -> D.snapCuts); za běhu
  // čas filmu jemně dotahuje hodiny hudby (D.BeatClock, ±12 %), takže zdržení kvůli dlaždicím
  // nebo pomalý start přehrávače rytmus nerozbije. Skok (kapitola, přetočení) posune hudbu za filmem.
  var BEAT_RELOCK_S = 2.5;
  var beatClock = new D.BeatClock({ offset: 0, relock: 1e9 });
  // Gate 2 D: the app picks the track whose energy fits the trip (mood.py -> data.music.file);
  // without a pick (older data, track removed) the trip id chooses, as before
  function musicIndexFor(data) {
    if (!music.tracks.length || !data) return -1;
    var want = data.music && data.music.file;
    if (want) {
      for (var k = 0; k < music.tracks.length; k++) if (music.tracks[k].file === want) return k;
    }
    return Math.abs(+data.id || 0) % music.tracks.length;
  }
  window.musicIndexFor = musicIndexFor;
  function musicTrackFor(data) {
    var i = musicIndexFor(data);
    return i < 0 ? null : music.tracks[i];                                 // stejná volba jako musicStart
  }
  function musicGrid(data, until) {
    var tr = music.enabled ? musicTrackFor(data) : null;
    return tr && tr.beats && tr.beats.period > 0 ? D.beatGrid(tr.beats, until) : null;
  }
  function musicLength() {
    var tr = musicTrackFor(journey.data), el = music.el;
    var len = tr && tr.beats && tr.beats.length > 0 ? tr.beats.length : el ? el.duration : NaN;
    return isFinite(len) && len > 0 ? len : NaN;
  }
  function musicClock() {             // čas skladby přes smyčky (s), nebo NaN (hudba nehraje)
    var el = music.el, len = musicLength();
    if (!el || el.paused || !isFinite(len) || el.readyState < 2) return NaN;
    if (el.currentTime + 1 < (music.lastT || 0)) music.loops = (music.loops || 0) + 1;
    music.lastT = el.currentTime;
    return (music.loops || 0) * len + el.currentTime;
  }
  function musicSeekTo(t) {
    var el = music.el, len = musicLength();
    if (!el || !isFinite(len)) return;
    music.loops = Math.floor(t / len);
    try { el.currentTime = t - music.loops * len; } catch (e) { /* ještě nenačteno */ }
    music.lastT = el.currentTime;
  }
  function beatRate() {
    if (!film || !film.grid || !music.enabled || FILM_SPEED !== 1) return 1;
    var at = musicClock();
    if (!isFinite(at)) return 1;
    if (Math.abs(at - director.t) > BEAT_RELOCK_S) { musicSeekTo(director.t); return 1; }
    return beatClock.rate(director.t, at);
  }
  window.getBeatState = function () {
    if (!film) return null;
    return { locked: !!film.grid, snapped: film.beats || 0, period: film.grid ? film.grid.period : 0,
             cuts: film.dwells.map(function (g) { return +g.t0.toFixed(3); }),
             downbeats: film.grid ? film.grid.downbeats.slice(0, 64) : [], beats: film.grid ? film.grid.beats.slice(0, 256) : [] };
  };
  window.getMusicState = function () {
    return { enabled: music.enabled, tracks: music.tracks.length, track: music.track,
             playing: !!music.el && !music.el.paused, volume: music.el ? +music.el.volume.toFixed(3) : 0, target: music.target };
  };
  document.getElementById('jmusic').addEventListener('click', function () {
    music.enabled = !music.enabled;
    musicButton();
    syncMusic();
    if (bridge && bridge.setJourneyMusic) bridge.setJourneyMusic(music.enabled);   // zapamatovat (config.json)
  });

  document.getElementById('jplay').addEventListener('click', togglePause);
  document.getElementById('jprev').addEventListener('click', function () { skip(-1); });
  document.getElementById('jnext').addEventListener('click', function () { skip(1); });
  document.getElementById('jclose').addEventListener('click', function () { stopJourney(false); });
  document.getElementById('jdone').addEventListener('click', function () { stopJourney(false); });
  document.getElementById('jreplay').addEventListener('click', replay);
  document.getElementById('jdaynext').addEventListener('click', function () { stepDay(1); });
  document.getElementById('jnextday').addEventListener('click', function () { stepDay(1); });
  document.getElementById('jwhole').addEventListener('click', function () { playDay(-1); });

  window.journeyState = function () {
    var seg = film ? film.segs[segIndexAt(director.t)] : null;
    return { active: journey.active, index: journey.i, paused: journey.paused, ended: journey.ended,
             stops: journey.data ? journey.data.stops.length : 0,
             frames: document.querySelectorAll('#jstrip .chap').length,
             polaroids: document.querySelectorAll('#jmoment .moment.show').length,
             card: journey.card === undefined ? null : journey.card,
             place: document.getElementById('jplace').textContent,
             route: !!(map && map.getLayer('j-done')), sky: skyNow.sky || null,
             t: director.t, total: film ? film.total : 0, segment: seg ? seg.kind : null,
             day: journey.day, days: tripDays().length };
  };
  window.journeyPause = togglePause;
  window.journeySkip = skip;
  window.journeySeek = function (t) {          // pro testy / ladění: čas filmu v sekundách
    if (!film) return false;
    director.t = Math.max(0, Math.min(film.total, +t || 0));
    director.directing = true;
    renderFilm(0);
    directorStart();
    return true;
  };

  document.addEventListener('keydown', function (e) {
    if (journey.active) {
      if (e.target && e.target.id === 'jprogress' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) return;
      if (e.key === ' ') { e.preventDefault(); togglePause(); }
      else if (e.key === 'ArrowRight') skip(1);
      else if (e.key === 'ArrowLeft') skip(-1);
      else if (e.key === 'PageDown') { e.preventDefault(); stepDay(1); }
      else if (e.key === 'PageUp') { e.preventDefault(); stepDay(-1); }
      else if (/^[0-9]$/.test(e.key) && tripDays().length) playDay(+e.key - 1);
      else if (e.key === 'Escape') stopJourney(false);
      return;
    }
    if (e.key === 'Escape') {
      if (document.getElementById('jlist').classList.contains('open')) toggleList(false);
      else window.pullBack();
    }
  });


  // ── Velikost stránky ────────────────────────────────────────────────────────
  // Only a real size change resizes: map.resize() re-allocates the canvas (a cleared frame) and
  // fires move/moveend (pin recluster) – it used to run on every return to the map tab.
  var lastSize = '';
  function onResize() {
    if (!map) { createMap(); return; }      // záložka se poprvé zobrazila
    var size = mapEl.clientWidth + 'x' + mapEl.clientHeight + '@' + window.devicePixelRatio;
    if (size !== lastSize) { lastSize = size; map.resize(); }
    initialView(); render();
  }

  // ── Seamless hand-off with map_host.py ──
  // Before the host lets Chromium go cold (minimized, long on another tab) it asks for 'hold': a
  // copy of the last map frame above the canvas and under every control. The first frame after
  // the resume therefore equals the host's still; 'release' (the host saw a presented frame)
  // fades it out once the map has settled, 180 ms ease-out.
  var veil = null, veilToken = 0, veilTimer = 0;
  function dropVeil() {
    clearTimeout(veilTimer);
    if (veil && veil.parentNode) veil.parentNode.removeChild(veil);
    if (veil) { veil.width = 0; veil.height = 0; }
  }
  window.__kairosHandoff = function (what) {
    if (!map) return false;
    var token = ++veilToken;
    if (what === 'hold') {
      var asked = performance.now();
      map.once('render', function () {
        // a frame long after the request belongs to the resume, not to the hold
        if (token !== veilToken || performance.now() - asked > 1000) return;
        var c = map.getCanvas(), box = c.parentNode;
        if (!veil) { veil = document.createElement('canvas'); veil.id = 'handoff-veil'; }
        veil.width = c.width; veil.height = c.height;
        veil.style.transition = 'none'; veil.style.opacity = '1';
        try { veil.getContext('2d').drawImage(c, 0, 0); } catch (e) { dropVeil(); return; }
        box.parentNode.insertBefore(veil, box.nextSibling);
      });
      map.triggerRepaint();
      return true;
    }
    if (!veil || !veil.parentNode) return false;
    clearTimeout(veilTimer);
    var faded = false;
    function fade() {
      if (faded || token !== veilToken) return;
      faded = true;
      veil.style.transition = 'opacity 180ms cubic-bezier(0, 0, .2, 1)';
      veil.style.opacity = '0';
      veilTimer = setTimeout(dropVeil, 240);
    }
    if (map.loaded()) requestAnimationFrame(fade);
    else { map.once('idle', fade); veilTimer = setTimeout(fade, 350); }
    return true;
  };
  ['pointerdown', 'wheel'].forEach(function (t) {           // the user acts: live map, at once
    mapEl.addEventListener(t, function () { if (veil && veil.parentNode) { veilToken++; dropVeil(); } }, true);
  });
  var loadingTimer = setTimeout(function () {             // only a slow load shows the spinner
    if (!(map && map.loaded())) document.getElementById('maploading').classList.add('on');
  }, 350);
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(mapEl);
  window.addEventListener('resize', onResize);
  setBaseLayer('standard');
  createMap();
  // Pravé tlačítko: žádné menu prohlížeče (v aplikaci ho vypíná i NoContextMenu)
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
</script>
