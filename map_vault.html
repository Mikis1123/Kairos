<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Kairos – Mapa</title>
<!-- Batch 6: čistý MapLibre GL JS 5.24.0 (přibalený lokálně v vendor/, ověřené SHA-512 z npm) –
     skutečná 3D zeměkoule (projekce globe), atmosféra, 3D terén z AWS Terrain Tiles,
     piny fotek jako HTML značky, klidové otáčení, přelety a přehrávání Cesty.
     Podklady: Základní a Satelitní vektorově (OpenFreeMap, bez API klíče), bez stylu rastrová
     záloha (Esri); Turistická rastrově (OpenTopoMap + Waymarked Trails).
     Vše ostatní blokuje WebUrlInterceptor v main.py (ALLOWED_WEB_HOSTS). -->
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
  :root { --accent: #8B7CF6; --accent-soft: rgba(139,124,246,0.28);
          --glass: rgba(30,30,34,0.62); --glass-strong: rgba(30,30,34,0.86);
          --hair: rgba(255,255,255,0.12); --text: #F5F5F7; --text-2: #A1A1AA; --ease: cubic-bezier(.2,.8,.2,1); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06070C;
               font-family: 'Segoe UI Variable Text', 'Segoe UI', -apple-system, sans-serif; color: var(--text); }
  /* Vesmír za zeměkoulí: plátno MapLibre je mimo glóbus průhledné */
  #map { position: absolute; inset: 0;
         background: radial-gradient(ellipse 70% 60% at 50% 46%, #141B33 0%, #0A0D18 55%, #05060B 100%); }
  .glass { background: var(--glass); border: 1px solid var(--hair); box-shadow: 0 8px 28px rgba(0,0,0,0.45);
           backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); }
  button { font: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Den a noc Cesty: tónování mezi mapou a piny (vkládá se do kontejneru plátna) */
  #tint { position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: multiply;
          transition: opacity 1.6s ease, background-color 1.6s ease; }

  .maplibregl-ctrl-attrib { background: rgba(28,28,30,0.72) !important; color: #8E8E93 !important; font-size: 10px; }
  .maplibregl-ctrl-attrib a { color: #AEAEB2 !important; }
  .maplibregl-ctrl-attrib-button { filter: contrast(0) brightness(2); }   /* bílá ikona (ne invert – žádné filtry přes dlaždice) */
  .maplibregl-ctrl-group { background: var(--glass) !important; border: 1px solid var(--hair);
                           box-shadow: 0 6px 22px rgba(0,0,0,0.45) !important; border-radius: 12px !important;
                           backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); overflow: hidden; }
  .maplibregl-ctrl-group button + button { border-top: 1px solid var(--hair) !important; }
  .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: contrast(0) brightness(2); }
  .maplibregl-ctrl-group button:hover { background: rgba(255,255,255,0.08) !important; }
  .maplibregl-ctrl-group button.tilt-btn { color: #F2F2F7; font: 700 11px/29px -apple-system, "Segoe UI", sans-serif;
                                           letter-spacing: .04em; }
  .maplibregl-ctrl-group button.tilt-btn[aria-pressed="true"] { color: var(--accent, #8B7CF6); }

  /* Cesta: nejlepší snímek zastávky – rozbalí se z bodu na mapě */
  .polaroid.hero { width: 264px; padding: 10px 10px 0; transform-origin: var(--ox, 50%) var(--oy, 100%); }
  .polaroid.hero .ph { height: 232px; }
  .polaroid.hero .cap { height: 36px; line-height: 36px; font-size: 13px; }

  /* Plovoucí přepínač podkladů – skleněná kapsle vpravo nahoře (segmentový ovladač) */
  #layers { position: absolute; top: 16px; right: 16px; z-index: 10; display: flex; gap: 2px; padding: 3px;
            border-radius: 12px; }
  #layers button, .seg { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 9px; color: #EBEBF0;
                   font-size: 12px; font-weight: 600; transition: background 0.15s ease, color 0.15s ease; }
  #layers button:hover, .seg:hover { background: rgba(255,255,255,0.10); }
  #layers button:focus-visible, .seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #layers button[aria-pressed="true"] { background: rgba(255,255,255,0.92); color: #1C1C1E; }

  #hud { position: absolute; top: 16px; left: 16px; z-index: 10; display: flex; align-items: center; gap: 2px;
         padding: 3px 3px 3px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  #hud .count { padding-right: 8px; color: var(--text); }
  .seg { display: inline-flex; align-items: center; gap: 6px; }
  .seg svg { width: 14px; height: 14px; }

  /* Výběr Cesty */
  #jlist { position: absolute; top: 60px; left: 16px; z-index: 11; width: 300px; max-height: calc(100% - 180px);
           overflow-y: auto; border-radius: 14px; padding: 6px; display: none; }
  #jlist.open { display: block; animation: sheet-in .22s var(--ease); }
  #jlist .head { padding: 8px 10px 6px; color: var(--text-2); font-size: 11px; font-weight: 600;
                 letter-spacing: .06em; text-transform: uppercase; }
  #jlist button { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer;
                  padding: 9px 10px; border-radius: 10px; }
  #jlist button:hover, #jlist button:focus-visible { background: rgba(255,255,255,0.08); }
  #jlist .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #jlist .s { font-size: 11px; color: var(--text-2); margin-top: 2px; }
  @keyframes sheet-in { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

  /* Piny fotek kreslí WebGL (vrstva „pins“, obrázky z plátna) – drží přesně na souřadnicích
     i během posunu a přiblížení; HTML značky se k plátnu dorovnávaly se zpožděním („plavaly“) */

  /* Náhledová karta při najetí na pin */
  #card { position: absolute; z-index: 12; pointer-events: none; width: 216px; padding: 8px; border-radius: 12px;
          background: rgba(36,36,38,0.92); opacity: 0; transform: translate(-50%, calc(-100% + 6px));
          transition: opacity .14s ease, transform .14s ease; }
  #card.show { opacity: 1; transform: translate(-50%, -100%); }
  .card-thumbs { display: grid; gap: 3px; border-radius: 8px; overflow: hidden; margin-bottom: 7px; }
  .card-thumbs.n1 { grid-template-columns: 1fr; height: 132px; }
  .card-thumbs.n2 { grid-template-columns: 1fr 1fr; height: 104px; }
  .card-thumbs.n3 { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; height: 116px; }
  .card-thumbs.n3 .t:first-child { grid-row: span 2; }
  .card-thumbs.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; height: 132px; }
  .card-thumbs .t { background: #3A3A3C center/cover no-repeat; }
  .card-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-sub { color: #8E8E93; font-size: 11px; margin-top: 2px; }

  .notice { position: absolute; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center;
            text-align: center; color: #8E8E93; pointer-events: none; }
  .notice div { background: rgba(28,28,30,0.9); border-radius: 14px; padding: 22px 28px; max-width: 360px; }
  .notice b { display: block; color: #F5F5F7; font-size: 16px; margin-bottom: 6px; }

  /* ── Cesta ─────────────────────────────────────────────────────────────── */
  #jx { position: absolute; inset: 0; z-index: 20; pointer-events: none; display: none; }
  body.journey #jx { display: block; }
  body.journey #layers, body.journey #hud, body.journey .maplibregl-ctrl-bottom-right { opacity: 0; pointer-events: none; }
  #layers, #hud, .maplibregl-ctrl-bottom-right { transition: opacity .4s ease; }
  /* Časová kapsle: úvodní a závěrečná karta */
  #jcap { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); min-width: 320px; max-width: 460px;
          padding: 26px 32px; border-radius: 22px; text-align: center; pointer-events: auto;
          opacity: 0; visibility: hidden; transition: opacity .6s ease, transform .6s var(--ease), visibility 0s .6s; }
  #jcap.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); transition-delay: 0s; }
  #jcap:not(.show) { transform: translate(-50%, -46%) scale(.97); }
  #jcap .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  #jcap .ago { margin-top: 4px; font-size: 13px; color: var(--text-2); }
  #jcap h1 { margin: 10px 0 6px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif;
             font-size: 30px; font-weight: 650; letter-spacing: -.01em; line-height: 1.15; }
  #jcap .meta { font-size: 13px; color: var(--text-2); }
  #jcap .actions { display: none; justify-content: center; gap: 8px; margin-top: 18px; }
  #jcap.end .actions { display: flex; }
  .pill { all: unset; cursor: pointer; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
          background: rgba(255,255,255,0.10); color: var(--text); }
  .pill:hover { background: rgba(255,255,255,0.16); }
  .pill.primary { background: var(--accent); color: #FFFFFF; }
  .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Popisek zastávky */
  #jcaption { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 16px;
              border-radius: 14px; text-align: center; white-space: nowrap; opacity: 0; transition: opacity .4s ease; }
  #jcaption.show { opacity: 1; }
  #jcaption .place { font-size: 15px; font-weight: 650; }
  #jcaption .when { font-size: 12px; color: var(--text-2); margin-top: 1px; }
  #jcaption .phase { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;
                     vertical-align: 1px; background: #FFD27A; box-shadow: 0 0 8px currentColor; transition: background 1.2s ease; }
  #jprogress { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); border-radius: 2px;
               transition: width .5s var(--ease); }
  /* Skleněné polaroidy */
  #jpol { position: absolute; inset: 0; overflow: hidden; }
  .polaroid { position: absolute; left: 0; top: 0; width: 156px; padding: 8px 8px 0; box-sizing: border-box;
              border-radius: 8px; background: rgba(255,255,255,0.20); border: 1px solid rgba(255,255,255,0.45);
              box-shadow: 0 18px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.5);
              backdrop-filter: blur(16px) saturate(1.7); -webkit-backdrop-filter: blur(16px) saturate(1.7);
              transform-origin: 50% 60%; will-change: transform, opacity; pointer-events: auto; cursor: pointer; }
  .polaroid .ph { height: 140px; border-radius: 3px; background: #2C2C2E center/cover no-repeat; }
  .polaroid .ph.noimg { background: linear-gradient(135deg, #3A3A3C, #232326); }
  .polaroid .cap { height: 30px; line-height: 30px; text-align: center; font-size: 12px; font-weight: 600;
                   color: #FFFFFF; text-shadow: 0 1px 3px rgba(0,0,0,0.55); }
  /* Filmový pás */
  #jdock { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(920px, calc(100% - 32px));
           display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: auto; }
  #jctl { display: flex; gap: 2px; padding: 3px; border-radius: 12px; }
  #jctl button { all: unset; cursor: pointer; width: 34px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
  #jctl button:hover { background: rgba(255,255,255,0.10); }
  #jctl button:focus-visible { outline: 2px solid var(--accent); }
  #jctl svg { width: 16px; height: 16px; fill: #F5F5F7; }
  #jstripwrap { position: relative; width: 100%; border-radius: 12px; padding: 10px 12px; box-sizing: border-box;
                background-color: rgba(14,14,16,0.78);
                background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.16) 0 6px, transparent 6px 14px),
                                  repeating-linear-gradient(90deg, rgba(255,255,255,0.16) 0 6px, transparent 6px 14px);
                background-size: 100% 3px, 100% 3px; background-position: 0 3px, 0 calc(100% - 3px); background-repeat: no-repeat; }
  #jstrip { display: flex; gap: 5px; overflow-x: auto; scroll-behavior: smooth; height: 54px; align-items: center;
            scrollbar-width: none; }
  #jstrip::-webkit-scrollbar { display: none; }
  #jstrip:empty::before { content: 'Fotky z cesty se tu poskládají do filmového pásu'; color: #8E8E93; font-size: 12px;
                          margin: 0 auto; }
  .frame { flex: 0 0 auto; width: 72px; height: 54px; border-radius: 3px; background: #2C2C2E center/cover no-repeat;
           cursor: pointer; opacity: 0; transition: opacity .2s ease, transform .15s ease; }
  .frame.in { opacity: 1; }
  .frame:hover { transform: translateY(-2px); }
  .frame.noimg { background: linear-gradient(135deg, #3A3A3C, #232326); }
  .divider { flex: 0 0 auto; width: 2px; height: 34px; margin: 0 6px; border-radius: 1px; background: var(--accent-soft); }
  @media (prefers-reduced-motion: reduce) { #jcap, .frame { transition: none; animation: none; } }
</style>
</head>
<body>
<div id="map" class="theme-standard"></div>
<div id="layers" class="glass" role="group" aria-label="Mapový podklad">
  <button type="button" data-layer="standard" aria-pressed="true" title="Světlá vektorová mapa s českými názvy (OpenFreeMap)">Základní</button>
  <button type="button" data-layer="satellite" aria-pressed="false" title="Letecké snímky (Esri) s vektorovými cestami a názvy">Satelitní</button>
  <button type="button" data-layer="outdoor" aria-pressed="false" title="Vrstevnice, stínování terénu a značené trasy">Turistická</button>
</div>
<div id="hud" class="glass" hidden>
  <span class="count" id="hudcount"></span>
  <button type="button" class="seg" id="btn-globe" title="Zpět na zeměkouli (Esc)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.3"/><path d="M1.8 8h12.4M8 1.7c2 2 2 10.6 0 12.6M8 1.7c-2 2-2 10.6 0 12.6"/></svg>Zeměkoule</button>
  <button type="button" class="seg" id="btn-journeys" aria-expanded="false" aria-controls="jlist" hidden title="Přehrát cestu z události">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="3.5" cy="12" r="1.6"/><circle cx="12.5" cy="4" r="1.6"/><path d="M5 11.2c3-1 1.5-4.6 4.5-5.8 1-.4 1.6-.8 1.6-.8" stroke-dasharray="1.6 1.8"/></svg>Cesty</button>
</div>
<div id="jlist" class="glass" role="dialog" aria-label="Cesty"></div>
<div id="card" class="glass"></div>
<div id="empty" class="notice"><div><b>Žádné fotografie s polohou</b>Fotky s GPS souřadnicemi se tu objeví po importu.</div></div>
<div id="nogl" class="notice"><div><b>Mapa potřebuje grafickou akceleraci</b>Zeměkouli kreslí WebGL, které tu není k dispozici. Fotky ani jejich polohy se tím nemění.</div></div>

<div id="jx" aria-live="polite">
  <div id="jpol"></div>
  <div id="jcaption" class="glass"><div class="place"><span class="phase" id="jphase"></span><span id="jplace"></span></div>
    <div class="when" id="jwhen"></div></div>
  <div id="jcap" class="glass" role="dialog" aria-label="Cesta">
    <div class="eyebrow">Cesta</div><div class="ago" id="jago"></div>
    <h1 id="jtitle"></h1><div class="meta" id="jmeta"></div>
    <div class="actions"><button type="button" class="pill" id="jreplay">Přehrát znovu</button>
      <button type="button" class="pill primary" id="jdone">Hotovo</button></div>
  </div>
  <div id="jdock">
    <div id="jctl" class="glass" role="toolbar" aria-label="Přehrávání cesty">
      <button type="button" id="jprev" aria-label="Předchozí zastávka"><svg viewBox="0 0 16 16"><path d="M3 2.5h1.6v11H3zM13.5 2.8v10.4L5.8 8z"/></svg></button>
      <button type="button" id="jplay" aria-label="Pozastavit"><svg viewBox="0 0 16 16"><path id="jplayicon" d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg></button>
      <button type="button" id="jnext" aria-label="Další zastávka"><svg viewBox="0 0 16 16"><path d="M11.4 2.5H13v11h-1.6zM2.5 2.8v10.4L10.2 8z"/></svg></button>
      <button type="button" id="jclose" aria-label="Ukončit cestu (Esc)"><svg viewBox="0 0 16 16"><path d="M3.7 2.6 8 6.9l4.3-4.3 1.1 1.1L9.1 8l4.3 4.3-1.1 1.1L8 9.1l-4.3 4.3-1.1-1.1L6.9 8 2.6 3.7z"/></svg></button>
    </div>
    <div id="jstripwrap"><div id="jstrip" role="list" aria-label="Filmový pás cesty"></div><div id="jprogress"></div></div>
  </div>
</div>
<script>
  var CELL_PX = 64;                   // velikost buňky shlukování na obrazovce
  var PIN_PX = 58;                    // piny blíž než tohle by se překrývaly (pin 52 px + okraj)
  var MAX_CARD_THUMBS = 4;
  var TILE_PX = 512;                  // MapLibre: svět na z0 = 512 px
  var GLOBE_ZOOM = 1.7;               // celá zeměkoule v okně
  var GLOBE_SPIN_MAX_ZOOM = 4;        // klidové otáčení jen při pohledu na zeměkouli
  var IDLE_SPIN_MS = 12000;           // tak dlouho bez zásahu, než se zeměkoule začne otáčet
  var SPIN_DEG_PER_S = 2.4;
  var TERRAIN_MIN_ZOOM = 8;           // 3D terén až od přiblížení krajiny (na zeměkouli neviditelný)
  var TERRAIN_EXAGGERATION = 1.35;
  // Zeměkoule se do roviny překlopí dřív než výchozí „globe“ (z 11–12): terén a jeho mlha
  // MapLibre fungují jen v mercatoru („terrain is not fully supported on vertical perspective
  // projection“, „calculateFogMatrix is not supported on globe projection“ za každý snímek)
  var GLOBE_FLAT_FROM = 6, GLOBE_FLAT_AT = 7.5;   // < TERRAIN_MIN_ZOOM
  var GLOBE_PROJECTION = ['interpolate', ['linear'], ['zoom'],
                          GLOBE_FLAT_FROM, 'vertical-perspective', GLOBE_FLAT_AT, 'mercator'];
  // Výškové dlaždice nesmí jít hlouběji než nejmělčí podklad (vektory OpenMapTiles do z14),
  // jinak „cannot calculate elevation if elevation maxzoom > source.maxzoom“ u přetažených dlaždic
  var DEM_MAX_ZOOM = 14;
  // Tmavá grafitová zeměkoule: do z5 vlastní tmavé vrstvy (pevnina, oceány, ledovce, hranice),
  // do z6 prolnutí do podkladu – světlá Základní dřív svítila jako bílý kotouč ve tmě vesmíru
  var GLOBE_DARK_FROM = 5, GLOBE_DARK_TO = 6;
  var GRAPHITE = { land: '#22262D', water: '#0C0F15', ice: '#3A414C', border: 'rgba(196,206,226,0.26)',
                   coast: 'rgba(140,162,206,0.22)', label: '#8C95A6', halo: 'rgba(8,10,16,0.85)' };
  // Rastrové podklady (záloha Základní, Turistická) na zeměkouli ztlumené ke grafitu
  var GLOBE_RASTER_DIM = { standard: 0.30, outdoor: 0.55 };
  // Reliéf krajiny: jemné stínování z výškových dat pod cestami a popisky (tmavé stíny, chladné světlo)
  var HILLSHADE_MIN_ZOOM = 7;
  var SPIN_MAX_MS = 60000;            // klidové otáčení po minutě dobrzdí – nečinná mapa nekreslí
  var FLY_PITCH = 52;                 // náklon kamery při příletu ke shluku v krajině (= „3D“ přepínače)
  var TILT_MS = 650;
  // Úroveň detailu dlaždic v nakloněném pohledu: výchozí MapLibre (9,3 úrovně zoomu na obrazovce)
  // dává vzdálené polovině okna dlaždice o 3–4 úrovně hrubší = „půlka ostrá, půlka rozmazaná“.
  // 6 drží vzdálené dlaždice ostřejší za cenu pár dlaždic navíc (jen při náklonu).
  var TILE_LOD_ZOOM_LEVELS = 6, TILE_LOD_RATIO = 3;
  var bridge = null;
  var map = null;                     // maplibregl.Map, vzniká až na viditelné stránce
  var markers = [];                   // [{id, lat, lon, name, city, date, thumb}]
  var clusters = [];                  // poslední shlukování [{items, lat, lon, px}]
  var fitted = false;
  var mapActive = true;               // záložka mapy je vidět (main.py: setMapActive)
  var mapErrors = [];
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var OSM = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
  var TRAILS_MIN_ZOOM = { hiking: 11, cycling: 12 };
  var ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
  // 3D terén: AWS Open Data Terrain Tiles (Mapzen terrarium), přesný host v ALLOWED_WEB_HOSTS
  var DEM_TILES = 'https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png';
  var DEM_ATTRIBUTION = 'Terén: <a href="https://registry.opendata.aws/terrain-tiles/">Mapzen, AWS Terrain Tiles</a>';
  // Každý podklad = podkladová vrstva + volitelné průhledné překryvy (hybridní satelit,
  // značené trasy). Jen hosty z ALLOWED_WEB_HOSTS v main.py, žádné API klíče.
  // gl = vektorová varianta (OpenFreeMap); layers = rastrová podoba / záloha bez stylu
  var BASE_LAYERS = {

    return n === 1 ? '1 zastávka' : (n >= 2 && n <= 4 ? n + ' zastávky' : n + ' zastávek');
  }
  function yearsAgo(s, now) {      // „Před 3 lety“ – časová kapsle
    var t = parseLocal(s);

    var y = now.getFullYear() - t.y;
    if (now.getMonth() + 1 < t.mo || (now.getMonth() + 1 === t.mo && now.getDate() < t.d)) y -= 1;

  window.yearsAgo = yearsAgo;

  // Náhledová karta: až 4 náhledy, místo, rozsah dat, počet
  function tipHtml(cluster) {
    var items = cluster.items;
    var withThumb = items.filter(function (m) { return m.thumb; }).slice(0, MAX_CARD_THUMBS);
    var thumbs = withThumb.length
      ? '<div class="card-thumbs n' + withThumb.length + '">'
        + withThumb.map(function (m) { return '<div class="t"' + bg(m.thumb) + '></div>'; }).join('')
        + '</div>'
      : '';

    var city = cities.length ? cities[0] : '';
    var title, sub;
    if (items.length > 1) {
      title = city ? esc(city) : 'Více míst';
      sub = [czCount(items.length), dateRange(items)].filter(Boolean).join(' · ');
    } else {
      title = esc(items[0].name);
      sub = [items[0].city, fmtDate(items[0].date)].filter(Boolean).join(' · ');

  }

  // ── Shlukování: mřížka v pixelech Web Mercatoru aktuálního přiblížení ─────────
  function mercPx(lat, lon, z) {
    var size = TILE_PX * Math.pow(2, z);
    var s = Math.max(-0.9999, Math.min(0.9999, Math.sin(lat * Math.PI / 180)));
    return { x: (lon + 180) / 360 * size, y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * size };
  }
  function pxDist(a, b) { return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)); }

  function viewFilter() {          // jen viditelná oblast + okraj; zeměkoule = vše
    if (!map || map.getZoom() < 4) return null;
    var b = map.getBounds(), w = b.getWest(), e = b.getEast(), s = b.getSouth(), n = b.getNorth();
    if (e - w >= 300) return null;
    var dx = (e - w) * 0.5, dy = (n - s) * 0.5;
    return function (m) {
      var lon = m.lon;
      while (lon < w - dx) lon += 360;
      while (lon > e + dx) lon -= 360;
      return m.lat >= s - dy && m.lat <= n + dy && lon >= w - dx && lon <= e + dx;
    };
  }

  function computeClusters(zoom) {
    var keep = viewFilter(), cells = {};
    markers.forEach(function (m) {
      if (keep && !keep(m)) return;
      var p = mercPx(m.lat, m.lon, zoom);
      var key = Math.floor(p.x / CELL_PX) + ':' + Math.floor(p.y / CELL_PX);
      var c = cells[key] || (cells[key] = { items: [], lat: 0, lon: 0 });
      c.items.push(m); c.lat += m.lat; c.lon += m.lon;
    });
    // Buňky mřížky dělí hustá místa podle hranic buněk -> dva piny přes sebe. Shluky, jejichž
    // piny by se překrývaly, sloučit (od největších, těžiště v pixelech).
    var list = Object.keys(cells).map(function (k) {
      var c = cells[k];
      c.lat /= c.items.length; c.lon /= c.items.length;
      c.px = mercPx(c.lat, c.lon, zoom);
      return c;
    }).sort(function (a, b) { return b.items.length - a.items.length; });
    var merged = [];
    list.forEach(function (c) {
      var host = null;
      for (var i = 0; i < merged.length; i++) {
        if (pxDist(merged[i].px, c.px) < PIN_PX) { host = merged[i]; break; }
      }
      if (!host) { merged.push(c); return; }
      var n = host.items.length, m = c.items.length;
      host.lat = (host.lat * n + c.lat * m) / (n + m);
      host.lon = (host.lon * n + c.lon * m) / (n + m);
      host.items = host.items.concat(c.items);
      host.px = mercPx(host.lat, host.lon, zoom);
    });
    return merged;
  }
  window.computeClusters = computeClusters;

  function currentZoom() { return map ? map.getZoom() : GLOBE_ZOOM; }

  // ── Piny jako nativní vrstva WebGL ──────────────────────────────────────────
  // Dřív HTML značky (maplibregl.Marker): DOM se k plátnu WebGL dorovnával se zpožděním snímku
  // a během posunu / přiblížení piny „plavaly“. Teď každý shluk = prvek GeoJSON a vrstva symbol
  // s obrázkem pinu (náhled v kruhu, bílý lem, stín, odznak počtu) nakresleným jednou do plátna.
  // Piny se tak kreslí ve stejném snímku jako mapa – přesně na souřadnicích, na zadní straně
  // zeměkoule je MapLibre sám skryje.
  var PIN_D = 52, PIN_PAD = 14, PIN_BOX = PIN_D + 2 * PIN_PAD;
  var PIN_DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  var PIN_IMAGE_BUDGET = 500;          // obrázků pinů v paměti GPU nejvýš tolik (nejstarší pryč)
  var pinImages = {};                  // klíč -> {data, used}; přežije setStyle (znovu addImage)
  var mapImages = {};                  // klíče už přidané do aktuálního stylu
  var thumbs = {};                     // url náhledu -> Image | 'loading' | 'error'
  var pinGeo = { type: 'FeatureCollection', features: [] };
  var pinTick = 0, pinRefresh = 0;

  function roundRect(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function disc(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.fill(); }

  function drawPin(img, count, hex) {
    var s = PIN_DPR, box = Math.round(PIN_BOX * s);
    var cv = document.createElement('canvas');
    cv.width = cv.height = box;
    var g = cv.getContext('2d');
    g.scale(s, s);
    var c = PIN_BOX / 2, r = PIN_D / 2;
    if (count > 1) {                                   // balíček fotek za pinem
      g.fillStyle = 'rgba(255,255,255,0.28)'; disc(g, c + 7, c + 7, r - 2);
      g.fillStyle = 'rgba(255,255,255,0.55)'; disc(g, c + 3.5, c + 3.5, r - 1);
    }
    g.save();
    g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 10; g.shadowOffsetY = 3;
    g.fillStyle = '#FFFFFF'; disc(g, c, c, r);
    g.restore();

    g.save();

    g.fillStyle = '#3A3A3C'; g.fillRect(c - ir, c - ir, 2 * ir, 2 * ir);

      var k = Math.max(2 * ir / iw, 2 * ir / ih);

    } else {
      g.fillStyle = '#8E8E93'; disc(g, c, c, ir - 11.5);
    }
    g.restore();
    if (count > 1) {                                   // odznak počtu vpravo nahoře
      var label = String(count);

      var w = Math.max(22, Math.ceil(g.measureText(label).width) + 12), h = 22;

  }

  function loadThumb(url) {

    im.onerror = function () { thumbs[url] = 'error'; schedulePinRefresh(); };

  }

    var url = c.items[0].thumb || '', n = c.items.length, hex = accent();
    var t = url ? thumbs[url] : 'error';
    if (url && !t) { loadThumb(url); t = 'loading'; }
    var ready = t && typeof t === 'object';
    var key = 'pin:' + (ready ? url : '-') + '|' + n + (n > 1 ? '|' + hex : '');

      var data = null;
      try { data = drawPin(ready ? t : null, n, hex); } catch (e) {
        thumbs[url] = 'error';                         // zamčené plátno: pin bez náhledu
        key = 'pin:-|' + n + (n > 1 ? '|' + hex : '');

      }
      if (data) pinImages[key] = { data: data };
    }
    pinImages[key].used = ++pinTick;
    if (map && styleReady && !mapImages[key]) {

      mapImages[key] = true;

  }

    keys.filter(function (k) { return !inUse[k]; })
        .sort(function (a, b) { return pinImages[a].used - pinImages[b].used; })
        .slice(0, keys.length - PIN_IMAGE_BUDGET)
        .forEach(function (k) {

        });
  }

  function addPinLayers() {
    if (!map || !styleReady || map.getSource('pins')) return;
    map.addSource('pins', { type: 'geojson', data: pinGeo });
    map.addLayer({ id: 'pins-halo', type: 'circle', source: 'pins',
                   layout: { visibility: journey.active ? 'none' : 'visible' },

  // Najetí a klik: shluk, jehož kruh je pod kurzorem (obrázek má okraj na stín a odznak)
  function pinAt(e) {

      var c = clusters[f.id];
      if (!c) return;
      var p = map.project([c.lon, c.lat]), d = Math.hypot(p.x - e.point.x, p.y - e.point.y);
      if (d <= bestD) { best = f.id; bestD = d; }

  }
  var hoverPin = null;
  function setPinHover(id) {

    if (hoverPin !== null && map.getSource('pins')) map.setFeatureState({ source: 'pins', id: hoverPin }, { hover: false });
    hoverPin = id;
    if (id !== null && map.getSource('pins')) map.setFeatureState({ source: 'pins', id: id }, { hover: true });

  }

  var card = document.getElementById('card'), cardFor = null;
  function showPinCard(i) {

    cardFor = c;
    card.innerHTML = tipHtml(c);
    var p = map.project([c.lon, c.lat]);

  // ── Kamera: přelety ke shlukům, návrat na zeměkouli, klidové otáčení ─────────
  function flyIn(items) {
    var lats = items.map(function (m) { return m.lat; }), lons = items.map(function (m) { return m.lon; });
    var b = new maplibregl.LngLatBounds([Math.min.apply(null, lons), Math.min.apply(null, lats)],
                                        [Math.max.apply(null, lons), Math.max.apply(null, lats)]);
    var cam = map.cameraForBounds(b, { padding: 90, maxZoom: map.getMaxZoom() - 1 }) || {};
    var zoom = cam.zoom === undefined ? map.getZoom() + 2 : cam.zoom;
    var opts = { center: cam.center || b.getCenter(), zoom: zoom,
                 pitch: zoom >= TERRAIN_MIN_ZOOM ? FLY_PITCH : (zoom >= 5 ? 25 : 0),
                 bearing: zoom >= TERRAIN_MIN_ZOOM ? map.getBearing() : 0 };
    stopSpin();
    if (reduceMotion || !hasSize()) { map.jumpTo(opts); return; }
    var hops = Math.abs(zoom - map.getZoom());
    map.flyTo(Object.assign(opts, { duration: Math.min(4200, 1400 + hops * 260), curve: 1.5, essential: true }));
  }

  function openCluster(c) {
    var items = c.items;
    if (items.length === 1) {
      if (bridge) bridge.openPhotoFromMap(items[0].id);
      return;
    }
    var maxZ = map ? map.getMaxZoom() : 19;
    var px = items.map(function (m) { return mercPx(m.lat, m.lon, maxZ); });
    var xs = px.map(function (p) { return p.x; }), ys = px.map(function (p) { return p.y; });
    var samePlace = pxDist({ x: Math.min.apply(null, xs), y: Math.min.apply(null, ys) },

    if (map && map.getZoom() < maxZ - 0.5 && !samePlace) {

  }
  window.getClusters = function () {
    return clusters.map(function (c) { return { count: c.items.length, ids: c.items.map(function (m) { return m.id; }),
                                                lat: c.lat, lon: c.lon, card: tipHtml(c) }; });
  };
  window.clickCluster = function (i) { if (clusters[i]) openCluster(clusters[i]); return !!clusters[i]; };

  function centroid() {            // střed fotek na zeměkouli (kruhový průměr délek – přes 180° poledník)
    if (!markers.length) return [15.5, 49.8];
    var sx = 0, sy = 0, lat = 0;
    markers.forEach(function (m) { sx += Math.cos(m.lon * Math.PI / 180); sy += Math.sin(m.lon * Math.PI / 180); lat += m.lat; });
    return [Math.atan2(sy, sx) * 180 / Math.PI, Math.max(-50, Math.min(60, lat / markers.length))];
  }

  // Úvodní pohled: zeměkoule natočená k fotkám (dřív fitBounds na všechny piny)
  function initialView() {
    if (fitted || !map || !markers.length) return;

    map.jumpTo({ center: centroid(), zoom: GLOBE_ZOOM, pitch: 0, bearing: 0 });
  }

  window.pullBack = function () {                       // plynulý návrat na zeměkouli
    if (!map) return false;
    var c = map.getCenter();
    var target = { center: [c.lng, Math.max(-35, Math.min(50, c.lat))], zoom: GLOBE_ZOOM, pitch: 0, bearing: 0 };
    hideCard();
    if (map.getZoom() >= TERRAIN_MIN_ZOOM) holdTerrain();   // let na zeměkouli bez terénu
    if (reduceMotion || !hasSize()) map.jumpTo(target);
    else map.flyTo(Object.assign(target, { duration: Math.min(3600, 1600 + map.getZoom() * 140), curve: 1.6, essential: true }));
    lastAct = Date.now() - IDLE_SPIN_MS + 2500;          // po návratu se zeměkoule brzy rozjede
    spinRested = false;
    return true;
  };
  document.getElementById('btn-globe').addEventListener('click', function () { window.pullBack(); });

  var lastAct = Date.now(), spinning = false, spinFrame = 0, spinT = 0, spinSpeed = 0;
  var spinStarted = 0, spinRested = false;   // rested = dotočeno, znovu až po zásahu uživatele
  function userActed() { lastAct = Date.now(); spinRested = false; stopSpin(); }
  function canSpin() {
    return !!map && !reduceMotion && mapActive && !journey.active && hasSize() && !cardFor

  }
  function startSpin() {

  }
  function spinStep(now) {

    spinT = now;
    if (now - spinStarted > SPIN_MAX_MS) {                                         // dobrzdění 2,5 s
      spinSpeed -= SPIN_DEG_PER_S * dt / 2.5;
      if (spinSpeed <= 0) { stopSpin(); spinRested = true; return; }
    } else {
      spinSpeed = Math.min(SPIN_DEG_PER_S, spinSpeed + SPIN_DEG_PER_S * dt / 2.5); // rozjezd 2,5 s
    }
    var c = map.getCenter();
    // od západu k východu jako skutečná Země: povrch se pohybuje zleva doprava

  window.isSpinning = function () { return spinning; };
  window.startSpinNow = function () { lastAct = 0; spinRested = false; startSpin(); return spinning; };
  window.setMapActive = function (on) {                  // main.py: záložka mapy shown / hidden
    mapActive = !!on;
    if (!mapActive) { stopSpin(); if (journey.active && !journey.paused) togglePause(); }
    else { lastAct = Date.now(); spinRested = false; onResize(); }
    return mapActive;
  };
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') stopSpin(); });

  window.setMarkers = function (data) {
    markers = Array.isArray(data) ? data : [];
    var hud = document.getElementById('hud');
    hud.hidden = markers.length === 0;
    document.getElementById('hudcount').textContent = czCount(markers.length) + ' na mapě';
    document.getElementById('empty').style.display = markers.length ? 'none' : 'flex';
    initialView();

  };
  window.getMarkerCount = function () { return markers.length; };
  window.getClusterCount = function () { return clusters.length; };
  window.getPinCount = function () {             // piny skutečně ve vrstvě WebGL
    return map && map.getSource('pins') ? pinGeo.features.length : 0;
  };
  window.getPinState = function () {
    return { layer: !!(map && map.getLayer('pins')), images: Object.keys(pinImages).length,
             visible: !!(map && map.getLayer('pins')) && map.getLayoutProperty('pins', 'visibility') !== 'none',
             thumbs: Object.keys(thumbs).filter(function (u) { return typeof thumbs[u] === 'object'; }).length,
             keys: pinGeo.features.map(function (f) { return f.properties.img; }) };
  };
  window.isFitted = function () { return fitted; };

  // ── Cesta: kinematické přehrávání výletu ────────────────────────────────────
  var journey = { active: false, data: null, i: -1, paused: false, timers: [], stripped: {}, raf: 0, ended: false };
  var journeyList = [];

  window.setJourneys = function (list) {
    journeyList = Array.isArray(list) ? list : [];
    var btn = document.getElementById('btn-journeys');
    btn.hidden = journeyList.length === 0;
    var box = document.getElementById('jlist');
    box.innerHTML = '<div class="head">Přehrát cestu</div>' + journeyList.map(function (j, i) {
      var sub = [j.location, dateRange([{ date: j.start }, { date: j.end }]), czCount(j.count)].filter(Boolean).join(' · ');
      return '<button type="button" data-i="' + i + '"><div class="t">' + esc(j.title) + '</div><div class="s">'
           + esc(sub) + '</div></button>';
    }).join('');
    box.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        toggleList(false);
        var j = journeyList[+b.dataset.i];
        if (j && bridge && bridge.requestJourney) bridge.requestJourney(j.id);
      });
    });
    return journeyList.length;

      if (!s || id === 'dem-shade' || !Array.isArray(s.tiles) || !s.tiles.length) return;
      if (s.type === 'raster-dem' && zoom < TERRAIN_MIN_ZOOM) return;      // terén jen v krajině
      var ts = s.tileSize || 512, maxz = s.maxzoom === undefined ? 22 : s.maxzoom;
      var z = Math.max(s.minzoom || 0, Math.min(maxz, Math.round(zoom + Math.log2(512 / ts))));
      var n = Math.pow(2, z), x = lon2tile(ll[0], z), y = lat2tile(ll[1], z);
      for (var dx = -radius; dx <= radius; dx++) {
        for (var dy = -radius; dy <= radius; dy++) {
          var ty = y + dy, tx = ((x + dx) % n + n) % n;
          if (ty < 0 || ty >= n || queued >= PREFETCH_PER_AREA) continue;
          var url = s.tiles[0].replace('{z}', z).replace('{x}', tx).replace('{y}', ty);
          if (prefetchSeen[url]) continue;
          prefetchSeen[url] = true;
          prefetchQueue.push(url);
          queued++;
        }
      }
    });
    pumpPrefetch();
    return queued;
  }
  function prefetchStop(i) {
    if (!journey.active || !journey.data || i < 0 || i >= journey.data.stops.length) return 0;
    var st = journey.data.stops, n = prefetchArea(stopLL(st[i]), STOP_ZOOM, 2);
    if (i > 0) {
      var km = haversineKm(stopLL(st[i - 1]), stopLL(st[i]));
      if (km > LOCAL_KM) n += prefetchArea(pathAt(legPath(i), 0.5).ll, hopZoom(km), 1);   // vrchol letu
    }
    return n;
  }
  window.prefetchStop = prefetchStop;
  // Koridor: dlaždice úseků from … from+count-1 podél dráhy kamery a ve výškách, kudy poletí
  // (krátký úsek: body po trase v krajině; let: čtvrtiny oblouku ve střední výšce). Volá se
  // klouzavě – na startu pro první úseky, na každé zastávce pro další, ne pro celou cestu naráz.
  function prefetchCorridor(from, count) {
    if (!journey.active || !journey.data || !map) return 0;
    var st = journey.data.stops, n = 0;
    for (var i = Math.max(0, from); i < Math.min(st.length, from + count); i++) {
      n += prefetchStop(i);
      if (i < 1) continue;
      var km = haversineKm(stopLL(st[i - 1]), stopLL(st[i])), pts = legPath(i);
      var fracs = km <= LOCAL_KM ? [0.25, 0.5, 0.75] : [0.25, 0.75];
      var zoom = km <= LOCAL_KM ? STOP_ZOOM - 0.5 : lerp(hopZoom(km), STOP_ZOOM, 0.5);
      fracs.forEach(function (f) { n += prefetchArea(pathAt(pts, f).ll, zoom, 1); });
    }
    return n;
  }
  window.prefetchCorridor = prefetchCorridor;

  // Události Cesty běží na hodinách režiséra: pauza je zastaví, přeskočení je zahodí
  function later(fn, ms) {
    director.events.push({ t: director.t + Math.max(0, ms || 0) / 1000, fn: fn });
    directorStart();
  }
  function clearTimers() {
    (journey.timers || []).forEach(clearTimeout);
    journey.timers = [];
    director.events = [];
    director.seg = null;
    journey.tracing = false;
  }

  function validJourney(d) {
    return d && Array.isArray(d.stops) && d.stops.length >= 2 && d.stops.every(function (s) {
      return isFinite(s.lat) && isFinite(s.lon) && Math.abs(s.lat) <= 90 && Math.abs(s.lon) <= 180;
    });
  }

  window.playJourney = function (data) {
    if (!validJourney(data)) return false;
    if (journey.active) stopJourney(true);
    toggleList(false);
    stopSpin(); hideCard();
    journey = { active: true, data: data, i: -1, paused: false, timers: [], stripped: {}, raf: 0, ended: false,
                tint: validHex(data.accent) ? data.accent : null };
    applyAccent(journey.tint || baseAccent);
    document.body.classList.add('journey');
    setPinsVisible(false);
    document.getElementById('jstrip').innerHTML = '';
    document.getElementById('jpol').innerHTML = '';
    document.getElementById('jprogress').style.width = '0';
    setPlayIcon(false);
    // časová kapsle
    var cap = document.getElementById('jcap');
    cap.classList.remove('end');
    document.getElementById('jago').textContent = yearsAgo(data.start);
    document.getElementById('jtitle').textContent = data.title || 'Cesta';
    document.getElementById('jmeta').textContent = [data.location, dateRange([{ date: data.start }, { date: data.end }])]
      .filter(Boolean).join(' · ') + ' · ' + czStops(data.stops.length) + ' · ' + czCount(data.count || 0);
    cap.classList.add('show');
    document.getElementById('jcaption').classList.remove('show');
    addRouteLayers();
    setInteraction('journey', true);               // aplikace: práce na pozadí počká do konce Cesty
    journeyMeter = makeMeter();
    director.t = 0;
    director.events = [];
    director.seg = null;
    // kamera: z výšky nad první zastávkou (zeměkoule), pak dolů – na hodinách režiséra
    var first = data.stops[0];
    if (map) {
      map.stop();
      director.heading = map.getBearing();
      var start = { center: [first.lon, Math.max(-50, Math.min(55, first.lat))], zoom: Math.min(map.getZoom(), 3.2),
                    pitch: 0, bearing: 0 };
      directCamera(start, reduceMotion ? 0 : 2200);
    }
    prefetchCorridor(0, 3);                        // dlaždice prvních úseků během úvodní kapsle
    later(function () { cap.classList.remove('show'); goStop(0); }, reduceMotion ? 1200 : 2800);
    return true;
  };

  var STOP_ZOOM = 13.2;
  function hopZoom(km) {              // nejvyšší bod letu: dál = výš (200 km ≈ z4.6, 1000 km ≈ zeměkoule)
    return Math.max(2.4, Math.min(10, 10.5 - 1.45 * Math.log2(Math.max(1, km / 12))));
  }
  function flightMs(km) {
    if (reduceMotion || !map || !hasSize()) return 0;
    return Math.round(Math.max(2600, Math.min(7000, 2400 + 1300 * Math.log10(1 + km))));
  }
  var POP_MS = 700, HOLD_MS = 1700, DROP_MS = 760, ORBIT_MS = 2600;

  function goStop(i) {
    var st = journey.data.stops;
    if (i < 0 || i >= st.length) return;
    clearTimers();
    journey.i = i;
    journey.paused = false;
    if (!journey.ended) document.getElementById('jcap').classList.remove('show');
    setPlayIcon(false);
    var s = st[i], prev = i > 0 ? st[i - 1] : null;
    var km = prev ? haversineKm(stopLL(prev), stopLL(s)) : 0;
    var ms = i === 0 ? Math.min(flightMs(km), 3600) : flightMs(km);
    // popisek + obloha podle času fotky
    var sun = sunPosition(s.lat, s.lon, s.start);
    var sky = sun ? skyAt(sun.el) : skyAt(40);
    sky.az = sun ? sun.az : 210;
    transitionSky(sky, Math.max(1200, ms));
    document.getElementById('jplace').textContent = s.city || 'Zastávka ' + (i + 1);
    document.getElementById('jwhen').textContent = [phaseLabel(sun), fmtDate(s.start) + (fmtTime(s.start) ? ' ' + fmtTime(s.start) : ''),
                                                    czCount(s.count || s.photos.length)].filter(Boolean).join(' · ');
    document.getElementById('jphase').style.background = sky.glow;
    document.getElementById('jcaption').classList.add('show');
    document.getElementById('jprogress').style.width = ((i + 1) / st.length * 100) + '%';
    // Krátký úsek: po skutečné stezce / silnici (spočtené na pozadí během minulé zastávky),
    // blíž a tempem podle délky trasy. Dlouhý (> LOCAL_KM): oblouk zoom + posun (van Wijk).
    var plan = planLeg(i);
    journey.tracing = true;
    setRouteLeg(i, plan.dur ? 0 : 1);
    prefetchStop(i);                    // cíl tohoto úseku (už je-li v cache, nic se nestahuje)
    beginSegment({ dur: plan.dur, onEnd: function () { setRouteLeg(i, 1); arrive(i); },
                   apply: function (u, dt) { setRouteLeg(i, applyLeg(plan, u, dt)); } });
    if (!plan.dur) applyLeg(plan, 1, 0);
  }

  // Příjezd: počkat na dlaždice cíle (nejdéle TILE_WAIT_MS – žádná prázdná krajina pod fotkou),
  // pak zastávka na hodinách režiséra – pomalý oblet s hladkým rozjezdem i dojezdem a fotky.
  function arrive(i, waited) {
    if (!journey.active || journey.i !== i) return;
    waited = waited || 0;
    if (map && !reduceMotion && waited < TILE_WAIT_MS && !tilesReady()) {
      beginSegment({ dur: 0.1, onEnd: function () { arrive(i, waited + 100); } });
      return;
    }
    prefetchCorridor(i + 1, 3);         // další úseky: dlaždice se stáhnou, zatímco se ukazují fotky
    requestTrail(i + 1);                // trasa dalšího úseku po cestách – na pozadí (Web Worker)
    var s = journey.data.stops[i];
    var shown = journey.stripped[i] ? 0 : popPolaroids(i);
    var hold = HOLD_MS * dwellWeight(s);
    var wait = shown ? POP_MS + 140 * (shown - 1) + hold : 600;
    var total = wait + (shown ? DROP_MS + 90 * shown + 250 : 200);
    var b0 = map ? map.getBearing() : 0;
    director.heading = b0;
    beginSegment({ dur: total / 1000, onEnd: function () { next(); }, apply: function (u) {
      if (!map || reduceMotion) return;
      director.heading = b0 + ORBIT_DEG * smootherstep(u);
      map.jumpTo({ bearing: director.heading });
    } });
    later(function () { dropToStrip(i); }, wait);
  }
  // Tempo: zastávka s mnoha fotkami (fotograf se zdržel) chvíli déle, letmá kratší
  function dwellWeight(s) {
    var n = Math.max(1, (s && s.count) || 1);
    return Math.max(0.8, Math.min(1.6, 0.8 + 0.18 * Math.log(n) / Math.LN2));
  }
  function tilesReady() {
    try { return !map || map.areTilesLoaded(); } catch (e) { return true; }
  }

  function next() {
    if (!journey.active) return;
    if (journey.i < journey.data.stops.length - 1) goStop(journey.i + 1);
    else finishJourney();
  }

  // Zastávka ukáže JEDEN snímek: nejlepší podle journey.best_shot (oblíbená > série pHash >
  // ostrost); starší data bez „best“ -> první fotka. Rozbalí se přímo z bodu zastávky na mapě.
  var HERO_W = 264, HERO_H = 278;
  function stopShots(s) {
    var b = s.best || (s.photos || [])[0];
    return b ? [b] : [];
  }
  function popPolaroids(i) {
    var s = journey.data.stops[i], box = document.getElementById('jpol');
    var photos = stopShots(s);
    var w = box.clientWidth || window.innerWidth, h = box.clientHeight || window.innerHeight;
    var anchor = map && hasSize() ? map.project(stopLL(s)) : { x: w / 2, y: h / 2 };
    photos.forEach(function (p) {
      var el = document.createElement('div');
      el.className = 'polaroid hero';
      el.dataset.id = p.id;
      el.innerHTML = '<div class="ph"></div><div class="cap"></div>';
      setBg(el.firstChild, p.image || p.thumb);      // ostrý náhled 2048 px, jinak miniatura
      el.lastChild.textContent = fmtTime(p.date) || fmtDate(p.date);
      var x = Math.max(16, Math.min(w - HERO_W - 16, anchor.x - HERO_W / 2));
      var y = Math.max(16, Math.min(h - HERO_H - 150, anchor.y - HERO_H - 30));
      var base = 'translate(' + x + 'px,' + y + 'px) rotate(-2deg)';
      el.style.setProperty('--ox', Math.round(anchor.x - x) + 'px');   // roste z bodu zastávky
      el.style.setProperty('--oy', Math.round(anchor.y - y) + 'px');
      el.style.transform = base;
      el.dataset.base = base;
      el.addEventListener('click', function () { openFromJourney(p.id); });
      box.appendChild(el);
      if (!reduceMotion) {
        el.animate([{ transform: base + ' scale(.06)', opacity: 0 },
                    { transform: base + ' scale(1.03)', opacity: 1, offset: 0.72 },
                    { transform: base, opacity: 1 }],
                   { duration: Math.round(POP_MS * 1.15), easing: 'cubic-bezier(.2,.9,.25,1)', fill: 'backwards' });
      }
    });
    return photos.length;
  }

  // Polaroidy „padají“ do filmového pásu: každý letí na své políčko (FLIP)
  function dropToStrip(i) {
    var s = journey.data.stops[i], strip = document.getElementById('jstrip');
    if (journey.stripped[i]) return;
    journey.stripped[i] = true;
    var pols = Array.prototype.slice.call(document.querySelectorAll('#jpol .polaroid'));
    if (strip.children.length) {
      var d = document.createElement('div');
      d.className = 'divider';
      d.title = s.city || '';
      strip.appendChild(d);
    }
    var photos = stopShots(s);
    var frames = photos.map(function (p) {
      var f = document.createElement('div');
      f.className = 'frame';
      f.setAttribute('role', 'listitem');
      f.title = [s.city, fmtDate(p.date), fmtTime(p.date)].filter(Boolean).join(' · ');
      f.dataset.id = p.id;
      setBg(f, p.thumb);
      f.addEventListener('click', function () { openFromJourney(p.id); });
      strip.appendChild(f);
      return f;
    });
    strip.scrollLeft = strip.scrollWidth;
    var host = document.getElementById('jpol').getBoundingClientRect();
    frames.forEach(function (f, k) {
      var el = pols[k];
      if (!el || reduceMotion) { f.classList.add('in'); if (el) el.remove(); return; }
      var r = f.getBoundingClientRect(), pr = el.getBoundingClientRect();
      var sc = r.width / pr.width;
      var tx = r.left - host.left + r.width / 2 - el.offsetWidth / 2, ty = r.top - host.top + r.height / 2 - el.offsetHeight / 2;
      var a = el.animate([{ transform: el.dataset.base, opacity: 1 },
                          { transform: 'translate(' + tx + 'px,' + ty + 'px) rotate(0deg) scale(' + sc + ')', opacity: 0.9 }],
                         { duration: DROP_MS, delay: k * 90, easing: 'cubic-bezier(.55,0,.25,1)', fill: 'forwards' });
      a.onfinish = function () { f.classList.add('in'); el.remove(); };
    });
    pols.slice(frames.length).forEach(function (el) { el.remove(); });
  }

  function flushPolaroids() {      // přeskočení: fotky zastávky (i ještě neukázané) rovnou do pásu
    if (journey.i >= 0 && !journey.stripped[journey.i]) {
      var keep = reduceMotion;
      reduceMotion = true;
      dropToStrip(journey.i);
      reduceMotion = keep;
    }
    document.getElementById('jpol').innerHTML = '';
  }

  function finishJourney() {
    clearTimers();
    journey.ended = true;
    var st = journey.data.stops;
    setRoute(st.length - 1, 1);
    document.getElementById('jcaption').classList.remove('show');
    transitionSky(Object.assign(skyAt(40), { az: 210 }), 2000);
    if (map) {
      var lons = st.map(function (s) { return s.lon; }), lats = st.map(function (s) { return s.lat; });
      var cam = map.cameraForBounds([[Math.min.apply(null, lons), Math.min.apply(null, lats)],
                                     [Math.max.apply(null, lons), Math.max.apply(null, lats)]],
                                    { padding: { top: 120, bottom: 200, left: 80, right: 80 }, maxZoom: 12 });
      var end = { center: cam ? [cam.center.lng, cam.center.lat] : stopLL(st[0]), zoom: cam ? cam.zoom : 6,
                  pitch: 0, bearing: 0 };
      directCamera(end, reduceMotion ? 0 : 3200, function () {
        journey.tracing = false;
        director.directing = false;     // přehled stojí: mapa zase sama řídí terén a piny
        restResolution();
      });
    }
    var cap = document.getElementById('jcap');
    document.getElementById('jago').textContent = 'Konec cesty';
    cap.classList.add('end');
    later(function () { cap.classList.add('show'); document.getElementById('jdone').focus(); }, reduceMotion ? 0 : 1800);
    setPlayIcon(true);
  }

  function stopJourney(silent) {
    if (!journey.active) return false;
    clearTimers();
    directorStop();
    if (journey.trailPending) journey.trailPending = {};
    if (map) map.stop();
    removeRouteLayers();
    journey.active = false;
    setInteraction('journey', false);
    restResolution();
    if (map) { terrainHold = false; syncTerrain(); }   // mapa zase řídí terén sama (plné převýšení)
    setExaggeration(TERRAIN_EXAGGERATION);
    if (journey.tint) { journey.tint = null; applyAccent(baseAccent); }
    document.body.classList.remove('journey');
    setPinsVisible(true);
    document.getElementById('jcap').classList.remove('show', 'end');
    document.getElementById('jcaption').classList.remove('show');
    document.getElementById('jpol').innerHTML = '';
    transitionSky(Object.assign(skyAt(40), { az: 210 }), silent ? 0 : 1500);
    if (!silent) {
      window.pullBack();
      // Fix 1C: uživatel Cestu opustil -> aplikace ho vrátí tam, odkud ji spustil (detail události)
      if (bridge && bridge.journeyClosed) bridge.journeyClosed();
    }
    return true;
  }
  // silent = konec vyžádaný aplikací (návrat Zpět): bez oddálení a bez hlášení zpět
  window.endJourney = function (silent) { return stopJourney(!!silent); };

  function togglePause() {
    if (!journey.active) return;
    if (journey.ended) { replay(); return; }
    // Pauza zastaví hodiny režiséra: kamera, čára trasy i události zastávky stojí přesně tam,
    // kde byly, a pokračování naváže (dřív se úsek po pauze spouštěl znovu od začátku)
    if (!journey.paused) {
      journey.paused = true;
      if (map) map.stop();
      setPlayIcon(true);
    } else {
      journey.paused = false;
      director.last = performance.now();       // žádný skok o dobu pauzy
      directorStart();
      setPlayIcon(false);
    }
  }
  function skip(delta) {
    if (!journey.active) return;
    var i = journey.ended ? journey.data.stops.length - 1 : journey.i;
    var target = Math.max(0, Math.min(journey.data.stops.length - 1, i + delta));
    flushPolaroids();
    if (journey.ended) { journey.ended = false; document.getElementById('jcap').classList.remove('show', 'end'); }
    goStop(target);
  }
  function replay() {
    var d = journey.data;
    stopJourney(true);
    window.playJourney(d);
  }
  function openFromJourney(id) {
    if (journey.active && !journey.paused && !journey.ended) togglePause();
    if (bridge) bridge.openPhotoFromMap(id);
  }
  function setPlayIcon(paused) {
    document.getElementById('jplayicon').setAttribute('d', paused ? 'M4 2.4v11.2L13.2 8z' : 'M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z');
    document.getElementById('jplay').setAttribute('aria-label', paused ? 'Přehrát' : 'Pozastavit');
  }
  document.getElementById('jplay').addEventListener('click', togglePause);
  document.getElementById('jprev').addEventListener('click', function () { skip(-1); });
  document.getElementById('jnext').addEventListener('click', function () { skip(1); });
  document.getElementById('jclose').addEventListener('click', function () { stopJourney(false); });
  document.getElementById('jdone').addEventListener('click', function () { stopJourney(false); });
  document.getElementById('jreplay').addEventListener('click', replay);

  window.journeyState = function () {
    return { active: journey.active, index: journey.i, paused: journey.paused, ended: journey.ended,
             stops: journey.data ? journey.data.stops.length : 0,
             frames: document.querySelectorAll('#jstrip .frame').length,
             polaroids: document.querySelectorAll('#jpol .polaroid').length,
             place: document.getElementById('jplace').textContent,
             route: !!(map && map.getLayer('j-done')), sky: skyNow.sky || null };
  };
  window.journeyPause = togglePause;
  window.journeySkip = skip;

  document.addEventListener('keydown', function (e) {
    if (journey.active) {
      if (e.key === ' ') { e.preventDefault(); togglePause(); }
      else if (e.key === 'ArrowRight') skip(1);
      else if (e.key === 'ArrowLeft') skip(-1);
      else if (e.key === 'Escape') stopJourney(false);
      return;
    }
    if (e.key === 'Escape') {
      if (document.getElementById('jlist').classList.contains('open')) toggleList(false);
      else window.pullBack();
    }
  });

  // ── Velikost stránky ────────────────────────────────────────────────────────
  function onResize() {
    if (!map) { createMap(); return; }      // záložka se poprvé zobrazila
    map.resize();
    initialView(); render();
  }
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(mapEl);
  window.addEventListener('resize', onResize);
  setBaseLayer('standard');
  createMap();
  // Pravé tlačítko: žádné menu prohlížeče (v aplikaci ho vypíná i NoContextMenu)
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
</script>
</body>
</html>
